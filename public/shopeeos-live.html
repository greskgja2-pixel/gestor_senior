;overflow:hidden}.editorHead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}.editorHead h2{font-size:19px;margin:0}.close{border:0;background:#f2f4f7;width:36px;height:36px;border-radius:9px;font-size:20px}.editorBody{display:grid;grid-template-columns:205px 1fr;min-height:580px}.tabs{border-right:1px solid var(--line);background:#fafbfc;padding:12px}.tabs button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:8px;color:#475467}.tabs button.active{background:#fff0eb;color:#b9381f;font-weight:750}.panel{padding:22px;min-width:0}.section{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:22px}.section:last-child{border:0}.section h3{margin:0 0 13px;font-size:16px}.formGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#475467;font-weight:650}.input,.select,.textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:10px 11px;background:#fff;color:#101828}.textarea{min-height:160px;resize:vertical}.input[readonly],.textarea[readonly]{background:#f8f9fb;color:#475467}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.gallery img{width:100%;aspect-ratio:1;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff}.attrList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.editorFoot{border-top:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fafbfc}.safeMsg{font-size:12px;color:#667085}.loading{padding:40px;text-align:center;color:#667085}.error{background:#fff1f0;border:1px solid #f4b8b2;color:#9f291d;padding:12px;border-radius:9px}.mobileOnly{display:none}.gate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;z-index:6}.gateCard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:38px 34px;max-width:380px;width:100%;text-align:center}.gateLogo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;margin:0 auto 18px}.gateCard h1{margin:0 0 8px;font-size:21px}.gateCard p{margin:0 0 24px;color:var(--muted);font-size:13.5px;line-height:1.55}.gateCard .btn{width:100%;padding:12px;font-size:15px}.gateNote{margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.5}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.content{padding:16px}.topbar{padding:0 16px}.grid{grid-template-columns:repeat(2,1fr)}.editorBody{grid-template-columns:1fr}.tabs{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.tabs button{white-space:nowrap;width:auto}.formGrid,.attrList{grid-template-columns:1fr}.mobileOnly{display:inline-block}}@media(max-width:560px){.grid{grid-template-columns:1fr}.products{grid-template-columns:1fr}.modalBack{padding:0}.editor{min-height:100vh;border-radius:0}.head{flex-direction:column}}
.prodTable th.sortable{cursor:pointer;user-select:none}.prodTable th.sortable:hover{color:#344054}.sortArrow{margin-left:3px;color:var(--brand);font-weight:800}

.catSelect{border:1px solid #d0d5dd;border-radius:9px;padding:9px 11px;background:#fff;font-size:13px;color:#344054;max-width:260px}
.bulkBar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#eef2ff;border:1px solid #c7d2fe;border-radius:11px;padding:10px 14px;margin:12px 0}.bulkBar strong{color:#3730a3}.bulkBar input{width:100px;border:1px solid #c7d2fe;border-radius:7px;padding:7px 9px;background:#fff;font-size:12.5px}
.varRow td{background:#fafbfc}.varRow .varName{padding-left:24px;font-size:12.5px;color:#475467}.expandBtn{border:0;background:transparent;color:var(--brand);font-weight:750;cursor:pointer;font-size:11.5px;padding:2px 0}
.zoomThumbWrap{position:relative}.zoomPreview{position:fixed;z-index:80;width:280px;height:280px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow);display:none;padding:8px}.zoomPreview img{width:100%;height:100%;object-fit:contain}.zoomPreview.show{display:block}

<body>
<div class="loading" id="bootLoading" style="padding-top:22vh">Verificando conexão com a Shopee…</div>
<div class="gate" id="gate">
  <div class="gateCard">
    <div class="gateLogo">S</div>
    <h1>Gestor Senior</h1>
    <p>Conecte a sua loja Shopee para ver produtos, pedidos e métricas reais neste painel.</p>
    <button class="btn primary" id="gateBtn">…</button>
    <div class="gateNote" id="gateNote"></div>
  </div>
</div>
<div class="app" id="appShell" style="display:none">
  <aside class="sidebar">
    <div class="logo"><span class="logoMark">S</span><span>Gestor Senior</span><span class="live">LIVE</span></div>
    <div class="nav" id="nav">
      <div class="navTitle">Dados reais</div>
      <button data-page="home" class="active">⌂ Visão geral</button>
      <button data-page="products">▦ Produtos</button>
      <button data-page="orders">▤ Pedidos</button>
      <button data-page="finance">R$ Financeiro</button>
      <button data-page="connection">⚙ Integração Shopee</button>
      <div class="navTitle">Módulos em integração</div>
      <button class="disabled" data-page="ads">◉ Shopee Ads<small>sem dados fictícios</small></button>
      <button class="disabled" data-page="competition">⌕ Concorrência<small>sem dados fictícios</small></button>
      <button class="disabled" data-page="seo">↗ SEO / Busca<small>sem dados fictícios</small></button>
      <button class="disabled" data-page="reports">▥ Relatórios<small>sem dados fictícios</small></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <strong id="topTitle">Visão geral</strong>
      <div class="status"><span class="dot" id="connDot"></span><span id="connText">Verificando Shopee…</span><button class="btn" id="authBtn" style="margin-left:12px">…</button></div>
    </header>
    <div class="content" id="content"><div class="loading">Carregando dados reais da Shopee…</div></div>
  </main>
</div>
<div class="modalBack" id="modal"><div class="editor" id="editor"></div></div>
<div class="zoomPreview" id="imgZoom"><img id="imgZoomImg" src="" alt=""></div>
<script>
(function(){
'use strict';
const state={page:'home',connection:null,products:[],orders:[],productStatus:null,categories:[],categoryMap:new Map(),categoriesLoaded:false,loadingProducts:false,loadingOrders:false,editorItem:null,editorTab:'basic',attrs:null,attrsCategory:null,brands:null,brandsCategory:null,models:null,modelItem:null,days:30,rangeFrom:null,rangeTo:null,finance:null,loadingFinance:false,productView:'grid',costs:new Map(),costsLoaded:false,ads:null,adsDays:null,loadingAds:false,busyItem:null,
prodSortKey:'name',prodSortDir:'asc',prodPageSize:24,prodPageNum:1,prodCategoryFilter:'',prodSearch:'',prodSelected:new Set(),showTotalSold:false,publicInfo:new Map(),loadingPublicInfo:false,modelsByItem:new Map(),loadingModelsFor:new Set(),expandedVariations:new Set()};
const content=document.getElementById('content'),modal=document.getElementById('modal'),editor=document.getElementById('editor');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—';}
function dateTime(v){if(!v)return'—';const d=typeof v==='number'?new Date(v*1000):new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('pt-BR');}
async function api(url,opts){let r;try{r=await fetch(url,Object.assign({cache:'no-store',signal:AbortSignal.timeout(20000)},opts||{},opts&&opts.body?{headers:Object.assign({'Content-Type':'application/json'},opts.headers||{})}:{}));}catch(e){throw new Error(e && e.name==='TimeoutError'?'Tempo esgotado falando com o servidor (20s).':('Falha de rede: '+(e.message||e)));}let j={};try{j=await r.json()}catch(e){}if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j;}
function statusPill(s){const x=String(s||'').toUpperCase();if(x==='NORMAL')return'<span class="pill ok">Ativo</span>';if(x==='BANNED'||x==='SHOPEE_DELETE')return'<span class="pill bad">'+esc(x)+'</span>';return'<span class="pill warn">'+esc(x||'Sem status')+'</span>';}
function stock(item){const s=item.stock_info_v2&&item.stock_info_v2.summary_info;return s&&Number.isFinite(Number(s.total_available_stock))?Number(s.total_available_stock):null;}
function price(item){const p=Array.isArray(item.price_info)&&item.price_info[0];if(p&&Number.isFinite(Number(p.current_price)))return Number(p.current_price);if(p&&Number.isFinite(Number(p.original_price)))return Number(p.original_price);return null;}
function currentImage(item){return item&&item.image&&Array.isArray(item.image.image_url_list)?item.image.image_url_list[0]:null;}
function categoryName(id){if(!id)return'Categoria '+(id||'—');const c=state.categoryMap.get(Number(id));return c?categoryPath(c.category_id):('Categoria ID '+id);}
function categoryPath(id){const names=[],seen=new Set();let cur=state.categoryMap.get(Number(id));while(cur&&!seen.has(cur.category_id)){seen.add(cur.category_id);names.unshift(cur.display_category_name||cur.original_category_name||String(cur.category_id));cur=state.categoryMap.get(Number(cur.parent_category_id));}return names.join(' › ')||('Categoria ID '+id);}
function shopLabel(c){if(!c)return'—';if(c.shopName)return c.shopName;if(c.shopId)return'Loja '+c.shopId;return'—';}
async function loadConnection(){try{state.connection=await api('/api/shopee/connection');if(state.connection&&state.connection.connected){document.getElementById('connDot').className='dot ok';document.getElementById('connText').textContent='Shopee LIVE conectada · '+shopLabel(state.connection);}else{document.getElementById('connDot').className='dot';document.getElementById('connText').textContent='Shopee desconectada';}}catch(e){state.connection={connected:false,error:e.message};document.getElementById('connDot').className='dot';document.getElementById('connText').textContent='Shopee desconectada';}updateAuthBtn();}
function updateAuthBtn(){const btn=document.getElementById('authBtn');if(!btn)return;const c=state.connection||{};btn.disabled=false;if(c.connected){btn.textContent='Sair da Shopee';btn.onclick=doLogout;}else if(c.paused){btn.textContent='Entrar com a Shopee';btn.onclick=doResume;}else{btn.textContent='Entrar com a Shopee';btn.onclick=()=>{window.top.location.href='/api/shopee/authorize';};}}
async function doLogout(){if(!window.confirm('Desconectar esta loja da Shopee neste painel? A credencial fica guardada com segurança — pra voltar é só clicar em "Entrar com a Shopee" de novo, sem precisar refazer o login na Shopee.'))return;const btn=document.getElementById('authBtn');btn.disabled=true;btn.textContent='Saindo…';try{await fetch('/api/shopee/logout',{method:'POST',cache:'no-store'});}catch(e){}window.top.location.reload();}
async function doResume(){const btn=document.getElementById('authBtn');if(btn){btn.disabled=true;btn.textContent='Entrando…';}const gateBtn=document.getElementById('gateBtn');if(gateBtn){gateBtn.disabled=true;gateBtn.textContent='Entrando…';}try{await fetch('/api/shopee/resume',{method:'POST',cache:'no-store'});}catch(e){}window.top.location.reload();}
function setupGate(){const btn=document.getElementById('gateBtn'),note=document.getElementById('gateNote');const c=state.connection||{};btn.disabled=false;if(c.paused){btn.textContent='Entrar com a Shopee';btn.onclick=doResume;note.textContent='Sua última sessão foi pausada — reconectar é instantâneo, sem passar pela Shopee de novo.';}else{btn.textContent='Entrar com a Shopee';btn.onclick=()=>{window.top.location.href='/api/shopee/authorize';};note.textContent='Você vai fazer login diretamente no site oficial da Shopee.';}}
function showGate(){document.getElementById('bootLoading').style.display='none';document.getElementById('appShell').style.display='none';document.getElementById('gate').style.display='flex';setupGate();}
function showApp(){document.getElementById('bootLoading').style.display='none';document.getElementById('gate').style.display='none';document.getElementById('appShell').style.display='';}
async function loadCategories(){if(state.categoriesLoaded)return;try{const j=await api('/api/shopee/catalog?resource=categories');state.categories=(j.response&&j.response.category_list)||j.category_list||[];state.categoryMap=new Map(state.categories.map(c=>[Number(c.category_id),c]));state.categoriesLoaded=true;}catch(e){console.error('categories',e);}}
async function loadProducts(refresh){state.loadingProducts=true;try{const j=await api('/api/shopee/products'+(refresh?'?refresh=1':''));state.products=Array.isArray(j.items)?j.items:[];await loadCategories();}finally{state.loadingProducts=false;}}
function rangeQuery(){return(state.rangeFrom&&state.rangeTo)?('from='+state.rangeFrom+'&to='+state.rangeTo):('days='+state.days);}
function rangeLabel(){if(state.rangeFrom&&state.rangeTo)return'de '+new Date(state.rangeFrom*1000).toLocaleDateString('pt-BR')+' até '+new Date(state.rangeTo*1000).toLocaleDateString('pt-BR');return'últimos '+state.days+' dias';}
async function loadOrders(refresh){state.loadingOrders=true;try{const j=await api('/api/shopee/orders?'+rangeQuery()+(refresh?'&refresh=1':''));state.orders=Array.isArray(j.orders)?j.orders:[];}finally{state.loadingOrders=false;}}
async function loadProductStatus(){try{state.productStatus=await api('/api/shopee/product-status');}catch(e){state.productStatus={error:e.message};}}
async function loadFinance(){state.loadingFinance=true;try{state.finance=await api('/api/shopee/finance?days='+state.days);}catch(e){state.finance={error:e.message};}finally{state.loadingFinance=false;}}
async function loadProductCosts(){try{const j=await api('/api/shopee/product-costs');state.costs=new Map((j.costs||[]).map(c=>[Number(c.item_id),{cost:c.cost,packaging_cost:c.packaging_cost}]));}catch(e){state.costs=new Map();}state.costsLoaded=true;}
async function saveProductCostFields(itemId,fields){const cur=state.costs.get(Number(itemId))||{cost:null,packaging_cost:null};const payload={item_id:Number(itemId),cost:('cost' in fields)?fields.cost:cur.cost,packaging_cost:('packaging_cost' in fields)?fields.packaging_cost:cur.packaging_cost};const j=await api('/api/shopee/product-costs',{method:'POST',body:JSON.stringify(payload)});state.costs.set(Number(itemId),{cost:j.cost,packaging_cost:j.packaging_cost});return j;}
async function saveProductCost(itemId,field,value){return saveProductCostFields(itemId,{[field]:value});}
async function loadAds(force){if(state.loadingAds)return;if(!force&&state.ads&&state.adsDays===state.days)return;state.loadingAds=true;try{state.ads=await api('/api/shopee/ads?days='+state.days);state.adsDays=state.days;}catch(e){state.ads={error:e.message};state.adsDays=state.days;}finally{state.loadingAds=false;}}
function setPage(page){state.page=page;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const titles={home:'Visão geral',products:'Produtos',orders:'Pedidos',connection:'Integração Shopee',ads:'Shopee Ads',finance:'Financeiro',competition:'Concorrência',seo:'SEO / Busca',reports:'Relatórios'};document.getElementById('topTitle').textContent=titles[page]||page;render();}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page);});
function header(title,desc,buttons){return'<div class="head"><div><h1>'+esc(title)+'</h1><p>'+esc(desc||'')+'</p></div><div>'+ (buttons||'') +'</div></div>';}
function metric(label,value,navPage,smallValue){const attrs=navPage?' data-nav="'+navPage+'"':'';const valStyle=smallValue?' style="font-size:18px"':'';return'<div class="metric"'+attrs+'><div class="k">'+esc(label)+'</div><div class="v"'+valStyle+'>'+esc(value)+'</div></div>';}
function toDateInputValue(ts){return new Date(ts*1000).toISOString().slice(0,10);}
function dayFilterHtml(current,allowCustom){const opts=[7,15,30,60,90];const custom=Boolean(allowCustom&&state.rangeFrom&&state.rangeTo);const pills='<div class="dayFilterRow">'+opts.map(d=>'<button class="dayPill'+((!custom&&d===current)?' active':'')+'" data-days="'+d+'">'+d+' dias</button>').join('');
if(!allowCustom)return pills+'</div>';
const fromVal=custom?toDateInputValue(state.rangeFrom):toDateInputValue(Math.floor(Date.now()/1000)-current*86400);
const toVal=custom?toDateInputValue(state.rangeTo):toDateInputValue(Math.floor(Date.now()/1000));
return pills+'<details class="dayCustom" id="dayCustomDetails"><summary class="'+(custom?'active':'')+'">📅 '+(custom?'Personalizado':'Escolher período…')+'</summary><div class="dayCustomBody"><div class="field"><label>De</label><input type="date" id="rangeFromInput" value="'+fromVal+'"></div><div class="field"><label>Até</label><input type="date" id="rangeToInput" value="'+toVal+'"></div><button class="btn primary" id="applyRangeBtn">Aplicar período</button></div></details></div>';}
function bindDayFilter(reload,rerender,allowCustom){content.querySelectorAll('.dayPill').forEach(b=>b.addEventListener('click',async()=>{const d=Number(b.dataset.days);if(!state.rangeFrom&&d===state.days)return;state.days=d;state.rangeFrom=null;state.rangeTo=null;content.innerHTML='<div class="loading">Atualizando período…</div>';try{await reload();rerender();}catch(e){content.innerHTML='<div class="error">'+esc(e.message)+'</div>';}}));
if(!allowCustom)return;
const applyBtn=document.getElementById('applyRangeBtn');
if(applyBtn)applyBtn.addEventListener('click',async()=>{const fromStr=document.getElementById('rangeFromInput').value,toStr=document.getElementById('rangeToInput').value;if(!fromStr||!toStr){window.alert('Escolha as duas datas.');return;}const from=Math.floor(new Date(fromStr+'T00:00:00').getTime()/1000),to=Math.floor(new Date(toStr+'T23:59:59').getTime()/1000);if(to<=from){window.alert('A data final precisa ser depois da data inicial.');return;}state.rangeFrom=from;state.rangeTo=to;content.innerHTML='<div class="loading">Atualizando período…</div>';try{await reload();rerender();}catch(e){content.innerHTML='<div class="error">'+esc(e.message)+'</div>';}});}
function orderStats(){const g={ready:0,shipped:0,cancel:0};let sales=0;state.orders.forEach(o=>{const s=String(o.order_status||'').toUpperCase();if(s==='READY_TO_SHIP'||s==='PROCESSED')g.ready++;else if(s==='SHIPPED'||s==='TO_CONFIRM_RECEIVE'||s==='COMPLETED')g.shipped++;else if(s==='CANCELLED'||s==='TO_RETURN'||s==='IN_CANCEL')g.cancel++;const amt=Number(o.total_amount);if(Number.isFinite(amt))sales+=amt;});return{ready:g.ready,shipped:g.shipped,cancel:g.cancel,sales};}
function renderHome(){const live=state.connection&&state.connection.connected;const os=orderStats();const ps=state.productStatus&&!state.productStatus.error?state.productStatus:{};const banned=Number.isFinite(ps.banned)?ps.banned:null;const unlist=Number.isFinite(ps.unlist)?ps.unlist:null;const bannedTotal=(banned!=null||unlist!=null)?((banned||0)+(unlist||0)):null;
const alerts=[];
if(os.ready>0)alerts.push({text:os.ready+(os.ready>1?' pedidos aguardando envio.':' pedido aguardando envio.'),page:'orders'});
if(os.cancel>0)alerts.push({text:os.cancel+(os.cancel>1?' pedidos com cancelamento ou devolução.':' pedido com cancelamento ou devolução.'),page:'orders'});
if(bannedTotal!=null&&bannedTotal>0)alerts.push({text:bannedTotal+(bannedTotal>1?' produtos banidos ou limitados precisam de atenção.':' produto banido ou limitado precisa de atenção.'),page:'products'});
content.innerHTML=header('Visão geral','Somente informações obtidas da integração real da Shopee.')+
'<div class="note oknote">✓ O catálogo de demonstração foi removido desta versão. Quando uma informação ainda não estiver integrada, o painel mostra "sem dados" em vez de inventar números.</div>'+
dayFilterHtml(state.days)+
'<div class="grid">'+metric('Conexão',live?'LIVE':'—','connection')+metric('Produtos carregados',state.products.length,'products')+metric('Pedidos no período ('+rangeLabel()+')',state.orders.length,'orders')+metric('Loja Shopee',live?shopLabel(state.connection):'—','connection',true)+'</div>'+
'<div class="grid" style="margin-top:14px">'+metric('Vendas no período ('+rangeLabel()+')',money(os.sales),'orders')+metric('Envios a processar',os.ready,'orders')+metric('Envios processados',os.shipped,'orders')+metric('Devolução / Reembolso / Cancelamento',os.cancel,'orders')+'</div>'+
'<div class="grid" style="margin-top:14px">'+metric('Produtos banidos / limitados',bannedTotal!=null?bannedTotal:'sem dados','products')+'</div>'+
(alerts.length?'<div class="note" style="margin-top:16px"><strong>Alertas</strong><ul style="margin:8px 0 0;padding-left:18px">'+alerts.map(a=>'<li><a href="#" data-nav="'+a.page+'">'+esc(a.text)+'</a></li>').join('')+'</ul></div>':'<div class="note oknote" style="margin-top:16px">Nenhum alerta no momento — pedidos e produtos sem pendência detectada.</div>')+
'<div class="note">Métricas de Ads, concorrentes, lucro, visitantes, cliques no anúncio, saldo/ROAS de Ads e desempenho geral da conta ainda não aparecem aqui: dependem de outros endpoints da Shopee que ainda não estão liberados/funcionando nesta integração.</div>';
content.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();setPage(el.dataset.nav);}));
bindDayFilter(()=>loadOrders(false),renderHome);
}
function findProduct(id){return state.products.find(x=>String(x.item_id)===String(id));}
function shopeeProductUrl(item){const shopId=state.connection&&state.connection.shopId;return shopId?('https://shopee.com.br/product/'+shopId+'/'+item.item_id):null;}
function actionBarHtml(item){const status=String(item.item_status||'').toUpperCase();const isUnlisted=status==='UNLIST';const lockToggle=status==='BANNED'||status==='SHOPEE_DELETE';const busy=state.busyItem!=null&&String(state.busyItem)===String(item.item_id);return'<div class="actionBar" data-actions="'+esc(item.item_id)+'">'
+'<button data-act="share"'+(busy?' disabled':'')+'>🔗 Compartilhar</button>'
+'<button data-act="edit"'+(busy?' disabled':'')+'>✎ Editar</button>'
+'<button data-act="melhoria"'+(busy?' disabled':'')+'>✨ Melhoria de anúncio</button>'
+'<button data-act="competitor"'+(busy?' disabled':'')+'>⌕ Concorrente</button>'
+'<button data-act="ads"'+(busy?' disabled':'')+'>📣 Ads</button>'
+'<button data-act="toggle"'+(busy||lockToggle?' disabled':'')+(lockToggle?' title="Status atual não permite esta ação por aqui"':'')+'>'+(isUnlisted?'▶ Reativar':'⏸ Desativar')+'</button>'
+'<button data-act="delete" class="danger"'+(busy?' disabled':'')+'>🗑 Excluir</button>'
+'</div>';}
function itemPriceOffer(item){if(item.has_model)return null;const p=Array.isArray(item.price_info)&&item.price_info[0];if(!p)return null;const original=Number.isFinite(Number(p.original_price))?Number(p.original_price):null;const current=Number.isFinite(Number(p.current_price))?Number(p.current_price):null;return{preco:original,oferta:current};}
function distinctCategories(){const ids=new Set(state.products.map(p=>Number(p.category_id)).filter(Boolean));return[...ids].map(id=>({id,name:categoryName(id)})).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));}
function productCard(item){const key=Number(item.item_id);const img=currentImage(item),p=price(item),st=stock(item),sku=item.item_sku||'Sem SKU';const checked=state.prodSelected.has(key)?' checked':'';const pub=state.publicInfo.get(key);const totalSoldLine=state.showTotalSold?('<div class="row tiny muted"><span>Vendas totais (desde sempre)</span><span>'+(pub?(pub.ok?(pub.historicalSold!=null?pub.historicalSold:'sem dados'):'sem dados'):(state.loadingPublicInfo?'carregando…':'—'))+'</span></div>'):'';return'<article class="card product" data-item="'+esc(item.item_id)+'"><div class="thumb zoomThumbWrap"><input type="checkbox" class="rowSelect" data-id="'+esc(item.item_id)+'"'+checked+' style="position:absolute;top:8px;left:8px;z-index:2;width:18px;height:18px">'+(img?'<img class="zoomTarget" data-full="'+esc(img)+'" src="'+esc(img)+'" alt="">':'<span class="placeholder">Sem imagem retornada</span>')+'</div><div class="pbody"><div class="pname">'+esc(item.item_name||'Produto sem nome')+'</div><div class="category" title="'+esc(categoryName(item.category_id))+'">'+esc(categoryName(item.category_id))+'</div><div class="row"><span class="muted tiny">SKU '+esc(sku)+'</span>'+statusPill(item.item_status)+'</div><div class="row"><span class="price">'+(p!=null?money(p):(item.has_model?'Preço por variação':'Preço indisponível'))+'</span><span class="muted">'+(st!=null?('Estoque '+st):(item.has_model?'Estoque por variação':'Estoque —'))+'</span></div>'+totalSoldLine+actionBarHtml(item)+'</div></article>';}
function productSalesMap(){const byItem=new Map(),byModel=new Map();(state.orders||[]).forEach(o=>{if(String(o.order_status||'').toUpperCase()==='CANCELLED')return;(Array.isArray(o.item_list)?o.item_list:[]).forEach(it=>{const id=Number(it.item_id);if(!id)return;const qty=Number(it.model_quantity_purchased)||0;const unitRaw=it.model_discounted_price!=null?it.model_discounted_price:it.model_original_price;const unit=Number(unitRaw)||0;const curItem=byItem.get(id)||{qty:0,revenue:0};curItem.qty+=qty;curItem.revenue+=qty*unit;byItem.set(id,curItem);const modelId=it.model_id!=null?Number(it.model_id):null;if(modelId!=null){const mk=id+':'+modelId;const curModel=byModel.get(mk)||{qty:0,revenue:0};curModel.qty+=qty;curModel.revenue+=qty*unit;byModel.set(mk,curModel);}});});return{byItem,byModel};}
function adsCapsuleList(capsule){return capsule&&capsule.ok?((capsule.data&&capsule.data.response&&capsule.data.response.campaign_list)||[]):null;}
function findItemIdInAdsEntry(e){if(!e||typeof e!=='object')return null;const direct=e.item_id!=null?e.item_id:(e.itemid!=null?e.itemid:e.reference_id);if(direct!=null)return Number(direct);if(e.common_info){const c=e.common_info,v=c.item_id!=null?c.item_id:c.itemid;if(v!=null)return Number(v);}return null;}
// Melhor esforço: a Shopee não documenta publicamente (pra nós, aqui) o nome exato do campo que liga
// uma campanha "product-level" ao item_id — testamos os nomes mais prováveis. Se nenhum bater,
// devolvemos null (= "sem dados"), nunca afirmamos "sem campanha" por engano.
function campaignIdsForItem(itemId){if(!state.ads||state.ads.error)return null;const camp=adsCapsuleList(state.ads.campaigns),settings=adsCapsuleList(state.ads.settings);if(camp===null&&settings===null)return null;const pools=[camp,settings].filter(Array.isArray);const ids=new Set();pools.forEach(list=>list.forEach(e=>{const iid=findItemIdInAdsEntry(e);if(iid!=null&&iid===Number(itemId)){const cid=e.campaign_id!=null?e.campaign_id:e.campaignId;if(cid!=null)ids.add(Number(cid));}}));return[...ids];}
function adsRawForCampaigns(ids){const rows=[];(adsCapsuleList(state.ads.campaignDaily)||[]).forEach(e=>{const cid=e.campaign_id!=null?e.campaign_id:e.campaignId;if(ids.includes(Number(cid)))Object.entries(e).forEach(([k,v])=>rows.push([cid+'.'+k,v]));});(adsCapsuleList(state.ads.settings)||[]).forEach(e=>{const cid=e.campaign_id!=null?e.campaign_id:e.campaignId;if(ids.includes(Number(cid)))Object.entries(e).forEach(([k,v])=>rows.push([cid+'.settings.'+k,v]));});return rows;}
function sortTh(label,key){const active=state.prodSortKey===key;const arrow=active?(state.prodSortDir==='asc'?'▲':'▼'):'';return'<th class="sortable" data-sort="'+key+'">'+label+(active?' <span class="sortArrow">'+arrow+'</span>':'')+'</th>';}
function sortValueFor(item,salesDetailed,key){const s=salesDetailed.byItem.get(Number(item.item_id))||{qty:0,revenue:0};const costEntry=state.costs.get(Number(item.item_id))||{};if(key==='name')return(item.item_name||'').toLowerCase();if(key==='sales')return s.qty;if(key==='price'){const po=itemPriceOffer(item);return po&&po.preco!=null?po.preco:-1;}if(key==='margin'){const cost=costEntry.cost,pack=costEntry.packaging_cost;if(cost==null||pack==null)return-Infinity;return s.revenue-(s.qty*Number(cost))-(s.qty*Number(pack));}return 0;}
function sortProducts(list,salesDetailed){const key=state.prodSortKey,dir=state.prodSortDir==='desc'?-1:1;return[...list].sort((a,b)=>{const va=sortValueFor(a,salesDetailed,key),vb=sortValueFor(b,salesDetailed,key);if(va<vb)return-1*dir;if(va>vb)return 1*dir;return 0;});}
function filteredProductList(){const q=(state.prodSearch||'').trim().toLowerCase();return state.products.filter(it=>{if(state.prodCategoryFilter&&String(it.category_id)!==String(state.prodCategoryFilter))return false;if(!q)return true;const hay=((it.item_name||'')+' '+(it.item_sku||'')+' '+it.item_id).toLowerCase();return hay.includes(q);});}
function paginateList(list){const size=state.prodPageSize;if(size==='all')return{pageItems:list,totalPages:1,page:1};const totalPages=Math.max(1,Math.ceil(list.length/size));const page=Math.min(Math.max(1,state.prodPageNum),totalPages);state.prodPageNum=page;const start=(page-1)*size;return{pageItems:list.slice(start,start+size),totalPages,page};}
function categorySelectHtml(){const cats=distinctCategories();if(!cats.length)return'';return'<select class="catSelect" id="prodCategorySelect"><option value="">Todas as categorias</option>'+cats.map(c=>'<option value="'+esc(c.id)+'"'+(String(state.prodCategoryFilter)===String(c.id)?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select>';}
function pageBarHtml(totalItems,totalPages,page){const sizes=[12,24,48,96];return'<div class="pageBar"><div class="pageInfo">'+totalItems+' produto(s) · página '+page+' de '+totalPages+'</div><div class="pageBtns"><label class="tiny muted">Por página: </label><select id="pageSizeSelect">'+sizes.map(s=>'<option value="'+s+'"'+(state.prodPageSize===s?' selected':'')+'>'+s+'</option>').join('')+'<option value="all"'+(state.prodPageSize==='all'?' selected':'')+'>Todos</option></select><button id="prevPageBtn"'+(page<=1?' disabled':'')+'>‹ Anterior</button><button id="nextPageBtn"'+(page>=totalPages?' disabled':'')+'>Próxima ›</button></div></div>';}
function bulkBarHtml(){if(!state.prodSelected.size)return'';return'<div class="bulkBar"><strong>'+state.prodSelected.size+' selecionado(s)</strong><input type="number" min="0" step="0.01" placeholder="Custo R$" id="bulkCost"><input type="number" min="0" step="0.01" placeholder="Custo embalagem R$" id="bulkPackaging"><button class="btn primary" id="bulkApplyBtn">Aplicar aos selecionados</button><button class="btn" id="bulkClearBtn">Cancelar seleção</button></div>';}
async function applyBulkCost(){const costRaw=document.getElementById('bulkCost').value.trim();const packRaw=document.getElementById('bulkPackaging').value.trim();if(!costRaw&&!packRaw){window.alert('Informe custo e/ou custo de embalagem.');return;}const cost=costRaw===''?undefined:Number(costRaw);const pack=packRaw===''?undefined:Number(packRaw);if((cost!==undefined&&(!Number.isFinite(cost)||cost<0))||(pack!==undefined&&(!Number.isFinite(pack)||pack<0))){window.alert('Valor inválido.');return;}const fields={};if(cost!==undefined)fields.cost=cost;if(pack!==undefined)fields.packaging_cost=pack;const ids=[...state.prodSelected];const btn=document.getElementById('bulkApplyBtn');btn.disabled=true;btn.textContent='Aplicando…';let okCount=0,failCount=0;for(const id of ids){try{await saveProductCostFields(id,fields);okCount++;}catch(e){failCount++;}}state.prodSelected.clear();renderProducts();if(failCount)window.alert('Custo aplicado em '+okCount+' produto(s). '+failCount+' falharam.');}
function modelVariationName(model,tierVariation){if(Array.isArray(model.tier_index)&&Array.isArray(tierVariation)&&tierVariation.length){const parts=model.tier_index.map((idx,i)=>{const tier=tierVariation[i];const opt=tier&&Array.isArray(tier.option_list)?tier.option_list[idx]:null;return opt&&(opt.option||opt.option_name)?(opt.option||opt.option_name):null;}).filter(Boolean);if(parts.length)return parts.join(' / ');}return model.model_name||('Modelo '+model.model_id);}
async function loadItemModelsCached(itemId){const key=Number(itemId);if(state.modelsByItem.has(key))return state.modelsByItem.get(key);if(state.loadingModelsFor.has(key))return null;state.loadingModelsFor.add(key);try{const j=await api('/api/shopee/catalog?resource=models&item_id='+encodeURIComponent(itemId));const data=j.response||j;state.modelsByItem.set(key,{ok:true,tier_variation:data.tier_variation||[],model:data.model||[]});}catch(e){state.modelsByItem.set(key,{ok:false,error:e.message});}finally{state.loadingModelsFor.delete(key);}return state.modelsByItem.get(key);}
function toggleVariations(itemId){const key=Number(itemId);if(state.expandedVariations.has(key)){state.expandedVariations.delete(key);renderProducts();return;}state.expandedVariations.add(key);renderProducts();if(!state.modelsByItem.has(key))loadItemModelsCached(key).then(()=>{if(state.page==='products'&&state.productView==='list'&&state.expandedVariations.has(key))renderProducts();});}
function variationRowsHtml(item,salesDetailed){const key=Number(item.item_id);const totalCols=12+(state.showTotalSold?1:0);const cache=state.modelsByItem.get(key);const costEntry=state.costs.get(key)||{};const cost=costEntry.cost,pack=costEntry.packaging_cost;const hasCosts=cost!=null&&pack!=null;if(!cache)return'<tr class="varRow"><td colspan="'+totalCols+'" class="varName">Carregando variações…</td></tr>';if(!cache.ok)return'<tr class="varRow"><td colspan="'+totalCols+'" class="varName">Não foi possível carregar as variações: '+esc(cache.error)+'</td></tr>';const models=cache.model||[];if(!models.length)return'<tr class="varRow"><td colspan="'+totalCols+'" class="varName">A Shopee não retornou variações para este item.</td></tr>';return models.map(m=>{const name=modelVariationName(m,cache.tier_variation);const mk=key+':'+Number(m.model_id);const s=salesDetailed.byModel.get(mk)||{qty:0,revenue:0};const pInfo=Array.isArray(m.price_info)&&m.price_info[0];const preco=pInfo&&Number.isFinite(Number(pInfo.original_price))?Number(pInfo.original_price):null;const oferta=pInfo&&Number.isFinite(Number(pInfo.current_price))?Number(pInfo.current_price):null;let marginRs=null,marginPct=null;if(hasCosts){marginRs=s.revenue-(s.qty*Number(cost))-(s.qty*Number(pack));marginPct=s.revenue>0?(marginRs/s.revenue*100):null;}return'<tr class="varRow"><td></td><td></td><td class="varName">↳ '+esc(name)+'</td><td>'+s.qty+'</td>'
+'<td>'+(preco!=null?money(preco):'—')+'</td>'
+'<td>'+(oferta!=null?money(oferta):'—')+'</td>'
+(state.showTotalSold?'<td class="tiny muted">—</td>':'')
+'<td class="tiny muted">—</td><td class="tiny muted">—</td><td class="tiny muted">—</td>'
+'<td>'+(hasCosts?money(marginRs):'<span class="muted tiny">cadastre custo</span>')+'</td>'
+'<td>'+(hasCosts?(marginPct==null?'<span class="muted tiny">sem vendas</span>':'<span class="'+(marginPct>=0?'marginPos':'marginNeg')+'">'+marginPct.toFixed(1)+'%</span>'):'<span class="muted tiny">—</span>')+'</td>'
+'<td></td></tr>';}).join('');}
function productRow(item,salesDetailed){const key=Number(item.item_id);const img=currentImage(item);const s=salesDetailed.byItem.get(key)||{qty:0,revenue:0};const costEntry=state.costs.get(key)||{};const cost=costEntry.cost,pack=costEntry.packaging_cost;const hasCosts=cost!=null&&pack!=null;let marginRs=null,marginPct=null;if(hasCosts){marginRs=s.revenue-(s.qty*Number(cost))-(s.qty*Number(pack));marginPct=s.revenue>0?(marginRs/s.revenue*100):null;}const adsIds=campaignIdsForItem(item.item_id);let adsCell;if(state.ads===null)adsCell='<span class="muted tiny">carregando…</span>';else if(adsIds===null)adsCell='<span class="muted tiny">sem dados</span>';else if(!adsIds.length)adsCell='<span class="muted tiny">—</span>';else adsCell='<button data-act="ads" data-id="'+esc(item.item_id)+'" style="padding:5px 9px;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:650">📣 Ver campanha</button>';

async function loadPublicInfoForPage(items){const ids=items.map(it=>Number(it.item_id)).filter(id=>!state.publicInfo.has(id));if(!ids.length)return;state.loadingPublicInfo=true;try{const j=await api('/api/shopee/product-public?item_ids='+ids.join(','));(j.results||[]).forEach(r=>{state.publicInfo.set(Number(r.item_id),r);});}catch(e){ids.forEach(id=>{if(!state.publicInfo.has(id))state.publicInfo.set(id,{ok:false,error:e.message});});}finally{state.loadingPublicInfo=false;if(state.page==='products'&&state.showTotalSold)renderProducts();}}

dayFilterHtml(state.days)+
'<div class="grid">'+metric('Repasses no período',money(payout),null)+metric('Período anterior (mesmo tamanho)',money(prevPayout),null)+metric('Variação',(list.length?(delta>=0?'+':'')+delta.toFixed(1)+'%':'sem dados'),null)+metric('Saldo disponível para saque',saldo||'sem dados',null,true)+'</div>'+

(tips.length?'<div class="note" style="margin-top:16px"><strong>Observações do período</strong><ul style="margin:8px 0 0;padding-left:18px">'+tips.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></div>':'')+
'<div class="card" style="margin-top:14px"><div class="tableWrap" style="border:0;box-shadow:none">'+(list.length?'<table class="table"><thead><tr><th>Pedido</th><th>Liberado em</th><th>Valor</th></tr></thead><tbody>'+list.map(x=>'<tr><td>'+esc(x.order_sn||'—')+'</td><td>'+esc(dateTime(x.escrow_release_time))+'</td><td>'+money(x.payout_amount)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">Nenhum repasse no período selecionado.</div>')+'</div></div>'+
(!walletOk?'<div class="note" style="margin-top:16px">Saldo disponível para saque: sem dados — a Shopee não liberou o endpoint de carteira para esta loja/ambiente (comum em contas de teste ou lojas fora do escopo de "loja local"). O saque continua sendo feito direto no Seller Center.</div>':'')+

bindDayFilter(loadFinance,renderFinance);
}
function renderInactive(){const names={ads:'Shopee Ads',competition:'Concorrência',seo:'SEO / Busca',reports:'Relatórios'};content.innerHTML='<div class="inactive"><div class="big">🛡️</div><h2>'+esc(names[state.page]||'Módulo')+'</h2><p>Este módulo foi temporariamente desativado porque a versão antiga era alimentada por dados de demonstração. Ele será reativado somente quando estiver ligado a uma fonte real da Shopee ou a dados reais cadastrados por você.</p><button class="btn" onclick="document.querySelector(\'[data-page=products]\').click()">Ir para Produtos reais</button></div>';}
function render(){if(state.page==='home'){if(window.GestorLiveModules&&window.GestorLiveModules.supports&&window.GestorLiveModules.supports('dashboard')){window.GestorLiveModules.render('dashboard');return;}renderHome();}else if(state.page==='products')openProducts();else if(state.page==='orders')renderOrders();else if(state.page==='connection')renderConnection();else if(state.page==='finance')openFinance();else renderInactive();}
function leafCategoryOptions(selected){if(!state.categoriesLoaded)return'<option value="'+esc(selected||'')+'">'+esc(categoryName(selected))+'</option>';const cats=state.categories.filter(c=>!c.has_children).sort((a,b)=>categoryPath(a.category_id).localeCompare(categoryPath(b.category_id),'pt-BR'));return cats.map(c=>'<option value="'+esc(c.category_id)+'" '+(Number(c.category_id)===Number(selected)?'selected':'')+'>'+esc(categoryPath(c.category_id))+'</option>').join('');}
async function loadAttributes(categoryId){if(state.attrsCategory===Number(categoryId)&&state.attrs)return state.attrs;const j=await api('/api/shopee/catalog?resource=attributes&category_id='+encodeURIComponent(categoryId));state.attrs=(j.response&&j.response.attribute_list)||j.attribute_list||[];state.attrsCategory=Number(categoryId);return state.attrs;}
async function loadBrands(categoryId){if(state.brandsCategory===Number(categoryId)&&state.brands)return state.brands;let offset=0,all=[];for(let i=0;i<10;i++){const j=await api('/api/shopee/catalog?resource=brands&category_id='+encodeURIComponent(categoryId)+'&offset='+offset);const r=j.response||j;all=all.concat(r.brand_list||[]);if(!r.has_next_page)break;offset=Number(r.next_offset||0);if(!offset)break;}state.brands=all;state.brandsCategory=Number(categoryId);return all;}
async function loadModels(itemId){if(state.modelItem===Number(itemId)&&state.models)return state.models;const j=await api('/api/shopee/catalog?resource=models&item_id='+encodeURIComponent(itemId));state.models=j.response||j;state.modelItem=Number(itemId);return state.models;}
function editorShell(item){const tabs=[['basic','Informação básica'],['images','Imagens'],['spec','Especificações'],['sales','Venda / variações'],['shipping','Envio'],['other','Outros']];editor.innerHTML='<div class="editorHead"><div><h2>'+esc(item.item_name||'Produto')+'</h2><div class="muted tiny">Item ID '+esc(item.item_id)+' · dados reais da Shopee</div></div><button class="close" id="closeEditor">×</button></div><div class="editorBody"><aside class="tabs">'+tabs.map(t=>'<button data-tab="'+t[0]+'" class="'+(state.editorTab===t[0]?'active':'')+'">'+t[1]+'</button>').join('')+'</aside><section class="panel" id="editorPanel"></section></div><div class="editorFoot"><div class="safeMsg">Modo seguro: os campos e opções são carregados da Shopee; gravação está bloqueada nesta limpeza para não alterar anúncios reais por engano.</div><button class="btn primary" disabled title="A atualização real será habilitada após validar os endpoints de escrita">Salvar na Shopee</button></div>';document.getElementById('closeEditor').onclick=closeEditor;editor.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.editorTab=b.dataset.tab;editorShell(item);renderEditorTab(item);});}
function currentAttrMap(item){const m=new Map();(item.attribute_list||[]).forEach(a=>m.set(Number(a.attribute_id),a));return m;}
function renderBasic(item){const panel=document.getElementById('editorPanel');panel.innerHTML='<div class="section"><h3>Informação básica</h3><div class="formGrid"><div class="field full"><label>Título do anúncio</label><input class="input" value="'+esc(item.item_name||'')+'"></div><div class="field"><label>SKU do vendedor</label><input class="input" value="'+esc(item.item_sku||'')+'"></div><div class="field"><label>Condição</label><select class="select"><option '+(item.condition==='NEW'?'selected':'')+' value="NEW">Novo</option><option '+(item.condition==='USED'?'selected':'')+' value="USED">Usado</option></select></div><div class="field full"><label>Categoria oficial Shopee</label><select class="select" id="categorySelect">'+leafCategoryOptions(item.category_id)+'</select><div class="tiny muted">Atual: '+esc(categoryName(item.category_id))+'</div></div></div></div><div class="section"><h3>Descrição real do anúncio</h3><textarea class="textarea">'+esc(item.description||'')+'</textarea></div>';document.getElementById('categorySelect').onchange=e=>{const id=Number(e.target.value);state.attrs=null;state.brands=null;document.querySelector('.safeMsg').textContent='Categoria selecionada: '+categoryName(id)+' — alteração ainda não será enviada à Shopee.';};}
function renderImages(item){const imgs=item.image&&Array.isArray(item.image.image_url_list)?item.image.image_url_list:[];document.getElementById('editorPanel').innerHTML='<div class="section"><h3>Imagens do anúncio</h3><p class="muted">'+imgs.length+' imagem(ns) retornada(s) diretamente pela Shopee.</p>'+(imgs.length?'<div class="gallery">'+imgs.map((u,i)=>'<div><img src="'+esc(u)+'" alt="Imagem '+(i+1)+'"><div class="tiny muted">Imagem '+(i+1)+'</div></div>').join('')+'</div>':'<div class="empty">A API não retornou imagens para este item.</div>')+'</div>'+(item.promotion_image&&item.promotion_image.image_url_list&&item.promotion_image.image_url_list.length?'<div class="section"><h3>Imagem promocional</h3><div class="gallery">'+item.promotion_image.image_url_list.map(u=>'<img src="'+esc(u)+'" alt="">').join('')+'</div></div>':'');}
async function renderSpec(item){const panel=document.getElementById('editorPanel');panel.innerHTML='<div class="loading">Carregando atributos oficiais da categoria…</div>';try{const attrs=await loadAttributes(item.category_id);const cur=currentAttrMap(item);panel.innerHTML='<div class="section"><h3>Especificações da categoria</h3><p class="muted">As opções abaixo vêm do endpoint de atributos da categoria '+esc(categoryName(item.category_id))+'.</p><div class="attrList">'+attrs.map(a=>attributeField(a,cur.get(Number(a.attribute_id)))).join('')+'</div></div>';if(!attrs.length)panel.innerHTML+='<div class="empty">A Shopee não retornou atributos para esta categoria.</div>';}catch(e){panel.innerHTML='<div class="error">Não foi possível carregar os atributos oficiais: '+esc(e.message)+'</div>';}}
function attributeField(def,current){const label=(def.display_attribute_name||def.original_attribute_name||('Atributo '+def.attribute_id))+(def.is_mandatory?' *':'');const values=Array.isArray(def.attribute_value_list)?def.attribute_value_list:[];const cv=current&&Array.isArray(current.attribute_value_list)?current.attribute_value_list[0]:null;const currentId=cv&&cv.value_id, currentName=cv&&(cv.display_value_name||cv.original_value_name);let control;if(values.length&&values.length<500){control='<select class="select"><option value="">Selecione</option>'+values.map(v=>{const name=v.display_value_name||v.original_value_name||String(v.value_id||'');const sel=(Number(v.value_id)&&Number(v.value_id)===Number(currentId))||(!Number(v.value_id)&&name===currentName);return'<option value="'+esc(v.value_id||name)+'" '+(sel?'selected':'')+'>'+esc(name)+(v.value_unit?' '+esc(v.value_unit):'')+'</option>';}).join('')+'</select>';}else{control='<input class="input" value="'+esc(currentName||'')+'" placeholder="'+(values.length?'Lista muito grande; pesquise pela Shopee':'Informe o valor')+'">';}return'<div class="field"><label>'+esc(label)+'</label>'+control+'</div>';}
async function renderSales(item){const panel=document.getElementById('editorPanel');let base='<div class="section"><h3>Preço e estoque</h3>';if(!item.has_model){const p=price(item),st=stock(item);base+='<div class="formGrid"><div class="field"><label>Preço atual</label><div class="input">'+(p!=null?money(p):'Não retornado')+'</div></div><div class="field"><label>Estoque disponível</label><div class="input">'+(st!=null?esc(st):'Não retornado')+'</div></div></div></div>';panel.innerHTML=base;return;}panel.innerHTML='<div class="loading">Carregando variações reais…</div>';try{const m=await loadModels(item.item_id),tiers=m.tier_variation||[],models=m.model||[];panel.innerHTML='<div class="section"><h3>Variações</h3><p class="muted">'+tiers.map(t=>esc(t.name||t.tier_variation_name||'Variação')+': '+esc((t.option_list||[]).map(o=>o.option||o.option_name||o).join(', '))).join('<br>')+'</p></div><div class="section"><h3>Modelos / SKUs</h3>'+(models.length?'<div class="tableWrap"><table class="table"><thead><tr><th>Model ID</th><th>SKU</th><th>Preço</th><th>Estoque</th></tr></thead><tbody>'+models.map(x=>{const pp=(x.price_info||[])[0]||{};const ss=x.stock_info_v2&&x.stock_info_v2.summary_info;return'<tr><td>'+esc(x.model_id||'—')+'</td><td>'+esc(x.model_sku||'—')+'</td><td>'+money(pp.current_price!=null?pp.current_price:pp.original_price)+'</td><td>'+esc(ss&&ss.total_available_stock!=null?ss.total_available_stock:(x.normal_stock!=null?x.normal_stock:'—'))+'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">Nenhum modelo retornado.</div>')+'</div>';}catch(e){panel.innerHTML='<div class="error">Não foi possível carregar variações: '+esc(e.message)+'</div>';}}
function renderShipping(item){const d=item.dimension||{},logs=item.logistic_info||[];document.getElementById('editorPanel').innerHTML='<div class="section"><h3>Peso e dimensões</h3><div class="formGrid"><div class="field"><label>Peso (kg)</label><div class="input">'+esc(item.weight||'—')+'</div></div><div class="field"><label>Comprimento (cm)</label><div class="input">'+esc(d.package_length!=null?d.package_length:'—')+'</div></div><div class="field"><label>Largura (cm)</label><div class="input">'+esc(d.package_width!=null?d.package_width:'—')+'</div></div><div class="field"><label>Altura (cm)</label><div class="input">'+esc(d.package_height!=null?d.package_height:'—')+'</div></div></div></div><div class="section"><h3>Canais logísticos retornados</h3>'+(logs.length?'<div class="tableWrap"><table class="table"><thead><tr><th>Canal</th><th>ID</th><th>Habilitado</th><th>Frete estimado</th></tr></thead><tbody>'+logs.map(l=>'<tr><td>'+esc(l.logistic_name||'—')+'</td><td>'+esc(l.logistic_id||'—')+'</td><td>'+(l.enabled?'Sim':'Não')+'</td><td>'+money(l.estimated_shipping_fee)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Nenhum canal logístico retornado.</div>')+'</div>';}
async function renderOther(item){const panel=document.getElementById('editorPanel');panel.innerHTML='<div class="loading">Carregando marcas oficiais da categoria…</div>';let brands=[];try{brands=await loadBrands(item.category_id)}catch(e){}const currentBrand=item.brand||{};panel.innerHTML='<div class="section"><h3>Marca e identificação</h3><div class="formGrid"><div class="field full"><label>Marca</label>'+(brands.length?'<select class="select"><option value="0">Sem marca</option>'+brands.map(b=>'<option value="'+esc(b.brand_id)+'" '+(Number(b.brand_id)===Number(currentBrand.brand_id)?'selected':'')+'>'+esc(b.display_brand_name||b.original_brand_name||b.brand_id)+'</option>').join('')+'</select>':'<div class="input">'+esc(currentBrand.original_brand_name||'Sem marca / lista não retornada')+'</div>')+'</div><div class="field"><label>Item ID</label><div class="input">'+esc(item.item_id)+'</div></div><div class="field"><label>GTIN / EAN</label><div class="input">'+esc(item.gtin_code||'Não retornado')+'</div></div><div class="field"><label>Status</label><div class="input">'+esc(item.item_status||'—')+'</div></div><div class="field"><label>Pré-venda</label><div class="input">'+(item.pre_order&&item.pre_order.is_pre_order?('Sim · '+esc(item.pre_order.days_to_ship)+' dias'):'Não')+'</div></div><div class="field"><label>Vídeo</label><div class="input">'+(item.video_info&&item.video_info.length?('Sim · '+esc(item.video_info.length)+' vídeo(s)'):'Não retornado')+'</div></div><div class="field"><label>Atualizado na Shopee</label><div class="input">'+esc(dateTime(item.update_time))+'</div></div></div></div><div class="note">Campos fiscais como NCM/CST não são inventados. Se a Shopee não os devolver neste endpoint, eles ficam fora do editor até existir uma fonte oficial para esses dados.</div>';}
function renderEditorTab(item){if(state.editorTab==='basic')renderBasic(item);else if(state.editorTab==='images')renderImages(item);else if(state.editorTab==='spec')renderSpec(item);else if(state.editorTab==='sales')renderSales(item);else if(state.editorTab==='shipping')renderShipping(item);else renderOther(item);}
async function openEditor(id){const item=state.products.find(x=>String(x.item_id)===String(id));if(!item)return;state.editorItem=item;state.editorTab='basic';state.attrs=null;state.brands=null;state.models=null;modal.classList.add('open');editorShell(item);renderEditorTab(item);}
function closeEditor(){modal.classList.remove('open');state.editorItem=null;}modal.addEventListener('click',e=>{if(e.target===modal)closeEditor();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeEditor();});
const zoomEl=document.getElementById('imgZoom'),zoomImg=document.getElementById('imgZoomImg');
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('.zoomTarget');if(!t)return;const src=t.dataset.full||t.src;if(!src)return;zoomImg.src=src;zoomEl.classList.add('show');});
document.addEventListener('mousemove',e=>{if(!zoomEl.classList.contains('show'))return;const pad=18;let x=e.clientX+pad,y=e.clientY+pad;if(x+280>window.innerWidth)x=e.clientX-280-pad;if(y+280>window.innerHeight)y=e.clientY-280-pad;zoomEl.style.left=Math.max(4,x)+'px';zoomEl.style.top=Math.max(4,y)+'px';});
document.addEventListener('mouseout',e=>{const t=e.target.closest&&e.target.closest('.zoomTarget');if(!t)return;if(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.zoomTarget')===t)return;zoomEl.classList.remove('show');});
async function start(){await loadConnection();if(!(state.connection&&state.connection.connected)){showGate();return;}showApp();const results=await Promise.allSettled([loadProducts(false),loadOrders(false),loadProductStatus()]);const labels=['produtos','pedidos','status de produtos'];results.forEach((r,i)=>{if(r.status==='rejected')console.error(labels[i],r.reason);});render();}
start();
})();
</script>
</body>
