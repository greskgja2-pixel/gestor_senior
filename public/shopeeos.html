<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ShopeeOS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* ============ TOKENS — one desktop OS per data-os value ============ */
  :root{
    --titlebar-h: 46px;
    --sidebar-w: 236px;
    --statusbar-h: 26px;
    --ok:#2E7D32; --ok-bg:#E7F5E9;
    --warn:#B26A00; --warn-bg:#FFF3DE;
    --bad:#C62828; --bad-bg:#FDE8E8;
    --font-mono: "Consolas","Ubuntu Mono",monospace;
  }

  /* ---- Windows XP (Luna Blue) ---- */
  [data-os="xp"]{
    --font: "Inter","system-ui","Segoe UI",Verdana,sans-serif;
    --bg:#7CA7DE;
    --surface:#ECE9D8; --surface-alt:#FFFFFF; --surface-raised:#F5F4EC;
    --border:#ACA899; --border-strong:#6D93C9;
    --text:#1F1F1F; --text-muted:#5A5A50;
    --accent:#2A66C9; --accent-text:#FFFFFF;
    --titlebar-bg:linear-gradient(180deg,#4E9BF7 0%,#2A66C9 42%,#0F4BC0 55%,#3D7BE0 100%);
    --titlebar-text:#FFFFFF; --titlebar-shadow:0 1px 0 rgba(0,0,0,.4);
    --sidebar-bg:linear-gradient(180deg,#3E82E8,#0B3E96 90%);
    --sidebar-text:#DCEBFF; --sidebar-muted:#9FC0EE;
    --sidebar-active-bg:#FFFFFF; --sidebar-active-text:#0B3E96;
    --btn-bg:linear-gradient(180deg,#FEFEFE,#E3E3E3 55%,#D2D2D2);
    --btn-text:#1F1F1F; --btn-border:#8C8C8C;
    --btn-primary-bg:linear-gradient(180deg,#8FCB6A,#5FA53A 55%,#4C9128);
    --btn-primary-text:#FFFFFF; --btn-primary-border:#3C7A1E;
    --radius-window:0px; --radius-card:2px; --radius-btn:3px; --radius-chip:2px;
    --shadow-card:1px 1px 0 rgba(0,0,0,.12);
    --shadow-window:2px 2px 6px rgba(0,0,0,.35);
    --track-bg:#fff; --track-border:#8C8C8C; --thumb-bg:linear-gradient(180deg,#fff,#ccc);
  }

  /* ---- Windows Vista (Aero) ---- */
  [data-os="vista"]{
    --font: "Inter","system-ui","Segoe UI",Tahoma,sans-serif;
    --bg:#4C86BF;
    --surface:#EEF4FA; --surface-alt:rgba(255,255,255,.82); --surface-raised:#FFFFFF;
    --border:rgba(88,132,178,.35); --border-strong:rgba(60,105,150,.55);
    --text:#132B40; --text-muted:#5A7691;
    --accent:#1E7BC2; --accent-text:#FFFFFF;
    --titlebar-bg:linear-gradient(180deg,#F2F8FE 0%,#CFE7FB 22%,#8FC2ED 55%,#5EA1DE 78%,#8FC2ED 100%);
    --titlebar-text:#0B2E4A; --titlebar-shadow:0 1px 0 rgba(255,255,255,.6) inset;
    --sidebar-bg:linear-gradient(180deg,rgba(112,168,220,.92),rgba(28,74,128,.94));
    --sidebar-text:#EAF4FF; --sidebar-muted:#B7D6F2;
    --sidebar-active-bg:rgba(255,255,255,.88); --sidebar-active-text:#0B2E4A;
    --btn-bg:linear-gradient(180deg,#FFFFFF,#DCEEFB 50%,#B6DBF6);
    --btn-text:#0B2E4A; --btn-border:#6FA8D8;
    --btn-primary-bg:linear-gradient(180deg,#DFF4C8,#9AD86A 50%,#6FBE3C);
    --btn-primary-text:#193A0B; --btn-primary-border:#5A9E2E;
    --radius-window:10px; --radius-card:9px; --radius-btn:7px; --radius-chip:99px;
    --shadow-card:0 3px 10px rgba(30,70,110,.14);
    --shadow-window:0 10px 30px rgba(15,40,70,.35);
    --track-bg:rgba(255,255,255,.7); --track-border:#8FC2ED; --thumb-bg:linear-gradient(180deg,#fff,#cfe7fb);
  }

  /* ---- Windows 10 ---- */
  [data-os="win10"]{
    --font:"Inter","system-ui","Segoe UI",Arial,sans-serif;
    --bg:#0078D4;
    --surface:#FFFFFF; --surface-alt:#F6F6F6; --surface-raised:#FFFFFF;
    --border:#E1E1E1; --border-strong:#C7C7C7;
    --text:#1B1B1B; --text-muted:#6B6B6B;
    --accent:#0078D4; --accent-text:#FFFFFF;
    --titlebar-bg:#0078D4; --titlebar-text:#FFFFFF; --titlebar-shadow:none;
    --sidebar-bg:#1F1F1F; --sidebar-text:#D9D9D9; --sidebar-muted:#8A8A8A;
    --sidebar-active-bg:#2D2D2D; --sidebar-active-text:#FFFFFF;
    --btn-bg:#F3F3F3; --btn-text:#1B1B1B; --btn-border:#C7C7C7;
    --btn-primary-bg:#0078D4; --btn-primary-text:#FFFFFF; --btn-primary-border:#0078D4;
    --radius-window:0px; --radius-card:2px; --radius-btn:2px; --radius-chip:2px;
    --shadow-card:0 1px 2px rgba(0,0,0,.08);
    --shadow-window:0 2px 10px rgba(0,0,0,.25);
    --track-bg:#E1E1E1; --track-border:#C7C7C7; --thumb-bg:#FFFFFF;
  }

  /* ---- Windows 11 ---- */
  [data-os="win11"]{
    --font:"Inter","system-ui","Segoe UI Variable","Segoe UI",Arial,sans-serif;
    --bg:#DCE7F2;
    --surface:#F3F3F3; --surface-alt:#FFFFFF; --surface-raised:#FFFFFF;
    --border:#E5E5E5; --border-strong:#D6D6D6;
    --text:#1A1A1A; --text-muted:#666666;
    --accent:#0067C0; --accent-text:#FFFFFF;
    --titlebar-bg:#F3F3F3; --titlebar-text:#1A1A1A; --titlebar-shadow:0 1px 0 #E5E5E5;
    --sidebar-bg:#FBFBFB; --sidebar-text:#1A1A1A; --sidebar-muted:#7A7A7A;
    --sidebar-active-bg:#E4ECFA; --sidebar-active-text:#0067C0;
    --btn-bg:#FFFFFF; --btn-text:#1A1A1A; --btn-border:#D6D6D6;
    --btn-primary-bg:#0067C0; --btn-primary-text:#FFFFFF; --btn-primary-border:#0067C0;
    --radius-window:12px; --radius-card:10px; --radius-btn:6px; --radius-chip:99px;
    --shadow-card:0 2px 10px rgba(0,0,0,.06);
    --shadow-window:0 12px 34px rgba(0,0,0,.18);
    --track-bg:#E5E5E5; --track-border:#D6D6D6; --thumb-bg:#FFFFFF;
  }

  /* ---- Ubuntu (Yaru) ---- */
  [data-os="ubuntu"]{
    --font:"Inter","system-ui","Ubuntu","Segoe UI",sans-serif;
    --bg:#77216F;
    --surface:#FAFAF9; --surface-alt:#FFFFFF; --surface-raised:#FFFFFF;
    --border:#E4DED9; --border-strong:#D2C9C2;
    --text:#2C2C2C; --text-muted:#6E6E6E;
    --accent:#E95420; --accent-text:#FFFFFF;
    --titlebar-bg:linear-gradient(180deg,#3D0930,#5E1F4E);
    --titlebar-text:#F6EDF3; --titlebar-shadow:0 1px 0 rgba(0,0,0,.4);
    --sidebar-bg:#2C0027; --sidebar-text:#F1E6EC; --sidebar-muted:#C9A8C0;
    --sidebar-active-bg:#E95420; --sidebar-active-text:#FFFFFF;
    --btn-bg:#EFEDEB; --btn-text:#2C2C2C; --btn-border:#D2C9C2;
    --btn-primary-bg:#E95420; --btn-primary-text:#FFFFFF; --btn-primary-border:#C4441A;
    --radius-window:8px; --radius-card:8px; --radius-btn:6px; --radius-chip:99px;
    --shadow-card:0 2px 10px rgba(0,0,0,.08);
    --shadow-window:0 14px 34px rgba(0,0,0,.3);
    --track-bg:#EFEDEB; --track-border:#D2C9C2; --thumb-bg:#FFFFFF;
  }

  /* ---- Aurora (tema autoral — recomendado, pensado pra cansar menos o olho) ---- */
  [data-os="aurora"]{
    --font:"Inter","system-ui","Segoe UI",sans-serif;
    --bg:#DCD6CC;
    --surface:#F8F6F2; --surface-alt:#FFFFFF; --surface-raised:#FFFFFF;
    --border:#E6E1D7; --border-strong:#D6CFC0;
    --text:#2B2A28; --text-muted:#79736A;
    --accent:#C4623F; --accent-text:#FFFFFF;
    --titlebar-bg:#F8F6F2; --titlebar-text:#2B2A28; --titlebar-shadow:0 1px 0 #E6E1D7;
    --sidebar-bg:#2A2622; --sidebar-text:#EDE8E0; --sidebar-muted:#9B9389;
    --sidebar-active-bg:#C4623F; --sidebar-active-text:#FFFFFF;
    --btn-bg:#FFFFFF; --btn-text:#2B2A28; --btn-border:#D6CFC0;
    --btn-primary-bg:#C4623F; --btn-primary-text:#FFFFFF; --btn-primary-border:#A84E30;
    --radius-window:16px; --radius-card:12px; --radius-btn:9px; --radius-chip:99px;
    --shadow-card:0 1px 3px rgba(43,39,35,.06), 0 1px 2px rgba(43,39,35,.04);
    --shadow-window:0 24px 60px rgba(30,25,20,.28);
    --track-bg:#F1EEE7; --track-border:#D6CFC0; --thumb-bg:#FFFFFF;
  }

  /* ---- Gestor Senior (couro azul-marinho e ouro) ---- */
  [data-os="gestor"]{
    --font:"Inter","Segoe UI",Arial,sans-serif;
    --bg:#04101E;
    --surface:#071728; --surface-alt:#0B2035; --surface-raised:#102A43;
    --border:rgba(221,181,92,.26); --border-strong:rgba(232,198,119,.46);
    --text:#F7F1E5; --text-muted:#C8C3B9;
    --accent:#D7AE58; --accent-text:#07111D;
    --titlebar-bg:linear-gradient(90deg,rgba(3,13,26,.97),rgba(10,34,57,.96),rgba(3,13,26,.97));
    --titlebar-text:#F3D387; --titlebar-shadow:0 1px 0 rgba(231,192,104,.28),0 8px 25px rgba(0,0,0,.28);
    --sidebar-bg:rgba(3,15,28,.94); --sidebar-text:#F6F0E3; --sidebar-muted:#B8AE9D;
    --sidebar-active-bg:linear-gradient(90deg,#B68732,#E3C16F); --sidebar-active-text:#07111D;
    --btn-bg:#102A43; --btn-text:#F7F1E5; --btn-border:rgba(221,181,92,.32);
    --btn-primary-bg:#D7AE58; --btn-primary-text:#07111D; --btn-primary-border:#F0D38B;
    --radius-window:14px; --radius-card:12px; --radius-btn:9px; --radius-chip:99px;
    --shadow-card:0 10px 28px rgba(0,0,0,.22); --shadow-window:0 20px 60px rgba(0,0,0,.46);
    --track-bg:#102A43; --track-border:rgba(221,181,92,.26); --thumb-bg:#D7AE58;
  }

  /* ============ BASE ============ */
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:#DDD;
    display:flex; align-items:stretch; justify-content:stretch;
    height:100vh; overflow:hidden;
  }
  .app{
    width:100%; height:100%;
    background:var(--surface); color:var(--text); font-family:var(--font);
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  [data-os="gestor"]{
    background-image:linear-gradient(rgba(3,12,23,.79),rgba(3,12,23,.87)),url("/leather-navy.png");
    background-size:cover,680px 680px;
    background-position:center;
  }
  [data-os="gestor"] .main{background:rgba(5,18,32,.72);backdrop-filter:blur(4px)}

  /* ---- Titlebar ---- */
  .titlebar{
    height:var(--titlebar-h); flex:0 0 auto; background:var(--titlebar-bg); color:var(--titlebar-text);
    display:flex; align-items:center; gap:10px; padding:0 8px 0 14px; box-shadow:var(--titlebar-shadow); position:relative;
    font-size:13px;
  }
  .titlebar .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px;}
  .titlebar .brand-logo{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:center 18%;border:1px solid rgba(232,198,119,.75);box-shadow:0 2px 8px rgba(0,0,0,.35)}
  [data-os="gestor"] .titlebar .brand{position:absolute;left:50%;transform:translateX(-50%);font-weight:800;letter-spacing:.4px;white-space:nowrap;}
  .titlebar .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent-text);opacity:.9}
  [data-os="ubuntu"] .titlebar .brand .dot{background:#E95420}
  [data-os="win10"] .titlebar .brand .dot,[data-os="xp"] .titlebar .brand .dot{background:#fff}
  [data-os="win11"] .titlebar .brand .dot,[data-os="vista"] .titlebar .brand .dot,[data-os="aurora"] .titlebar .brand .dot{background:var(--accent)}
  .titlebar .spacer{flex:1}
  .titlebar .store-chip{
    display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);
    padding:4px 10px 4px 4px;border-radius:999px;font-size:12px;
  }
  [data-os="win10"] .titlebar .store-chip,[data-os="win11"] .titlebar .store-chip,[data-os="aurora"] .titlebar .store-chip{background:rgba(0,0,0,.055)}
  [data-os="win11"] .titlebar .store-chip,[data-os="aurora"] .titlebar .store-chip{color:var(--text)}
  .titlebar .store-chip .avatar{
    width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  }
  .titlebar .icon-btn{
    width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;color:inherit;font-size:14px;cursor:pointer;opacity:.9;
  }
  .titlebar .icon-btn:hover{background:rgba(255,255,255,.18)}
  [data-os="win10"] .titlebar .icon-btn:hover,[data-os="win11"] .titlebar .icon-btn:hover,[data-os="aurora"] .titlebar .icon-btn:hover{background:rgba(0,0,0,.08)}
  .winctl{display:flex;gap:6px;margin-left:4px}
  .winctl span{width:12px;height:12px;border-radius:50%;display:inline-block;opacity:.9}
  [data-os="ubuntu"] .winctl{order:-1;margin-left:0;margin-right:8px}
  .winctl .wmin{background:#FFC93C}.winctl .wmax{background:#5FCB6B}.winctl .wclose{background:#F25F5C}
  [data-os="xp"] .winctl span,[data-os="vista"] .winctl span,[data-os="win10"] .winctl span,[data-os="win11"] .winctl span{
    border-radius:4px;width:26px;height:20px;
  }
  [data-os="xp"] .winctl,[data-os="vista"] .winctl,[data-os="win10"] .winctl,[data-os="win11"] .winctl{gap:2px}

  /* ---- Body layout ---- */
  .shell{flex:1; display:flex; min-height:0;}
  .sidebar{
    width:var(--sidebar-w); flex:0 0 auto; background:var(--sidebar-bg); color:var(--sidebar-text);
    overflow-y:auto; padding:12px 8px;
  }
  .sidebar .group-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--sidebar-muted);
    padding:12px 10px 6px;
  }
  .navbtn{
    width:100%; display:flex; align-items:center; gap:10px; padding:8px 10px; margin-bottom:2px;
    background:transparent; border:none; border-radius:var(--radius-btn); color:var(--sidebar-text);
    font-family:var(--font); font-size:13px; cursor:pointer; text-align:left;
  }
  .navbtn .ic{font-size:15px; width:18px; text-align:center;}
  .navbtn:hover{background:rgba(255,255,255,.10)}
  .navbtn.active{background:var(--sidebar-active-bg); color:var(--sidebar-active-text); font-weight:600;}
  [data-os="win11"] .navbtn.active{margin:0 2px 2px;}

  .main{flex:1; min-width:0; overflow-y:auto; background:var(--surface);}
  /* Ritmo vertical consistente: display:flex + gap (em vez de margin em cada componente) garante que
     TODO bloco direto da página fica exatamente à mesma distância do anterior — grid de KPI, section
     emoldurada, tip-box, alertbar solto etc. — sem depender de colapso de margem (que falha silenciosamente
     em botões/inline-flex e cria espaçamentos diferentes). Os wrappers com display:contents (usado nas
     páginas com re-render local) desaparecem do layout e deixam o gap "enxergar" os blocos de dentro. */
  .page{padding:22px 26px 40px; max-width:1040px; display:flex; flex-direction:column; gap:20px;}
  /* Botão/input/select/textarea não herdam font-family do documento por padrão no navegador —
     forçando herdar garante que a fonte do tema (a mesma do menu lateral) apareça igual em toda a página. */
  button, input, select, textarea{ font-family:inherit; }
  .page-head h1{font-size:19px;margin:0 0 4px;}
  .page-head p{margin:0;color:var(--text-muted);font-size:13px;max-width:64ch;}
  .badge-demo{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);
    border:1px dashed var(--border-strong);border-radius:var(--radius-chip);padding:2px 9px;margin-top:8px;
  }
  .badge-demo.done{color:var(--ok);border:1px solid var(--ok);border-style:solid;background:var(--ok-bg);}

  /* ---- Marcador 🔧 no menu lateral: página ainda não passou pela auditoria funcional ---- */
  .navbtn .pending-tag{margin-left:auto;font-size:10px;opacity:.75;flex:0 0 auto;}

  /* ---- Components ---- */
  .grid{display:grid;gap:14px;}
  .grid.cols-5{grid-template-columns:repeat(5,1fr);}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:900px){.grid.cols-5,.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr 1fr}}

  .card{
    background:var(--surface-alt); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); padding:14px 16px;
  }
  /* Ritmo interno da seção (entre o título e cada bloco de conteúdo, e entre blocos quando há mais de um,
     tipo 2-3 alertbars empilhados): gap fixo, igual em qualquer seção do site — mesma lógica do .page. */
  .section{display:flex; flex-direction:column; gap:14px;}
  .section > h2{font-size:13.5px; margin:0; display:flex; align-items:center; gap:8px;}
  .section > h2 .ic{font-size:15px}

  /* ---- Seção "emoldurada": título + conteúdo dentro de um retângulo único, cantos arredondados
     (padrão do site inteiro desde a aprovação do usuário — section() sempre aplica) ---- */
  .section.framed{
    background:var(--surface-alt); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); padding:16px 18px;
  }
  .section.framed > h2{
    padding-bottom:12px; border-bottom:1px solid var(--border);
  }

  .kpi .label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}
  .kpi .value{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;}
  .kpi .delta{font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums;}
  .delta.up{color:var(--ok)} .delta.down{color:var(--bad)} .delta.neutral{color:var(--text-muted)}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
     padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:9px 10px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:none;}
  .tablewrap{overflow-x:auto;}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--radius-chip);}
  .chip.ok{background:var(--ok-bg);color:var(--ok);}
  .chip.warn{background:var(--warn-bg);color:var(--warn);}
  .chip.bad{background:var(--bad-bg);color:var(--bad);}
  .chip.neutral{background:var(--surface);color:var(--text-muted);border:1px solid var(--border);}

  input[type=checkbox]{accent-color:var(--accent);}

  .btn{
    font-family:var(--font); font-size:12.5px; padding:7px 14px; border-radius:var(--radius-btn);
    background:var(--btn-bg); color:var(--btn-text); border:1px solid var(--btn-border); cursor:pointer;
  }
  .btn.primary{background:var(--btn-primary-bg);color:var(--btn-primary-text);border-color:var(--btn-primary-border);font-weight:600;}
  .btn.ghost{background:transparent;}
  .btn.danger{background:var(--bad);color:#fff;border-color:var(--bad);}
  .btn.sm{padding:5px 10px;font-size:11.5px;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;}

  .alertbar{
    display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:var(--radius-card);
    border:1px solid var(--border);
  }
  .alertbar.warn{background:var(--warn-bg);border-color:transparent;}
  .alertbar.ok{background:var(--ok-bg);border-color:transparent;}
  .alertbar.bad{background:var(--bad-bg);border-color:transparent;}
  .alertbar .ic{font-size:18px}
  .alertbar .body b{display:block;font-size:13px;margin-bottom:2px;}
  .alertbar .body span{font-size:12px;color:var(--text-muted);}
  .alertbar .actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0;}

  .rowlist .item{
    display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);
  }
  .rowlist .item:last-child{border-bottom:none;}
  .rowlist .item.clickable-row{cursor:pointer;}
  .rowlist .item.clickable-row:hover{background:var(--surface);}
  table tr.clickable-row{cursor:pointer;}
  table tr.clickable-row:hover{background:var(--surface-alt);}
  .rowlist .thumb{width:34px;height:34px;border-radius:6px;background:var(--surface);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;}
  .rowlist .txt{flex:1;min-width:0;}
  .rowlist .txt b{display:block;font-size:12.8px;}
  .rowlist .txt span{font-size:11.5px;color:var(--text-muted);}
  .rowlist .meta{font-size:12px;color:var(--text-muted);text-align:right;flex:0 0 auto;}

  .togglepanel .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
  .togglepanel .row:last-child{border-bottom:none;}
  .togglepanel .row .txt{flex:1}
  .togglepanel .row .txt b{font-size:12.8px;display:block;}
  .togglepanel .row .txt span{font-size:11.5px;color:var(--text-muted);}

  .switch{position:relative;width:40px;height:22px;flex:0 0 auto;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .track{position:absolute;inset:0;background:var(--track-bg);border:1px solid var(--track-border);border-radius:999px;transition:.15s;}
  .switch .thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--thumb-bg);border:1px solid var(--track-border);transition:.15s;}
  .switch input:checked + .track{background:var(--accent);border-color:var(--accent);}
  .switch input:checked + .track .thumb{transform:translateX(18px);}
  .switch input:checked ~ .thumb{transform:translateX(18px);background:#fff;border-color:var(--accent);}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field label{font-size:12px;color:var(--text-muted);}
  .field input[type=text],.field input[type=number],.field input[type=email],.field input[type=time],.field select{
    font-family:var(--font);font-size:13px;padding:7px 9px;border-radius:var(--radius-btn);
    border:1px solid var(--btn-border);background:var(--surface-alt);color:var(--text);
  }
  .fieldrow{display:flex;gap:14px;flex-wrap:wrap;}
  .fieldrow .field{flex:1;min-width:160px;}

  .themecard{
    border:2px solid var(--border); border-radius:var(--radius-card); padding:10px; cursor:pointer;
    background:var(--surface-alt); text-align:left;
  }
  .themecard.active{border-color:var(--accent);}
  .themecard .swatch{height:64px;border-radius:6px;margin-bottom:8px;display:flex;overflow:hidden;border:1px solid rgba(0,0,0,.12);}
  .themecard .swatch i{flex:0 0 30%;}
  .themecard .swatch b{flex:1;}
  .themecard h4{margin:0 0 2px;font-size:13px;}
  .themecard p{margin:0;font-size:11px;color:var(--text-muted);}

  .statusbar{
    height:var(--statusbar-h); flex:0 0 auto; display:flex; align-items:center; gap:16px; padding:0 14px;
    background:var(--surface-alt); border-top:1px solid var(--border); font-size:11px; color:var(--text-muted);
  }
  .statusbar .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px;}

  .empty-note{font-size:12px;color:var(--text-muted);padding:16px;border:1px dashed var(--border-strong);border-radius:var(--radius-card);}

  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid var(--surface);}
  ::-webkit-scrollbar-track{background:var(--surface);}

  svg text{font-family:var(--font);}

  /* ---- Shopee-Ads-style performance panel ---- */
  :root{ --series-a:#2E86D8; --series-b:#E8792B; }
  .tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);overflow-x:auto;}
  .tabs .tab{padding:9px 1px;font-size:13px;color:var(--text-muted);border-bottom:2px solid transparent;
    cursor:pointer;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font);white-space:nowrap;}
  .tabs .tab.active{color:var(--series-b);border-bottom-color:var(--series-b);font-weight:600;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .panel-head h3{font-size:15px;margin:0;}
  .panel-head .ctrls{display:flex;gap:8px;flex-wrap:wrap;}
  .qm{display:inline-block;width:13px;height:13px;border-radius:50%;border:1px solid var(--text-muted);color:var(--text-muted);
    font-size:9px;line-height:11px;text-align:center;margin-left:4px;cursor:help;}
  .kpi.hl-blue{border-top:3px solid var(--series-a);}
  .kpi.hl-orange{border-top:3px solid var(--series-b);}
  .legend-dot{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-muted);margin-left:14px;}
  .legend-dot i{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .list-headrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .list-headrow h3{font-size:14.5px;margin:0;}
  .opt-chip{display:inline-flex;align-items:center;gap:6px;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;}
  .opt-chip a{color:var(--accent);text-decoration:none;font-weight:700;margin-left:2px;}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .pill-btn{border:1px solid var(--btn-border);background:var(--surface-alt);color:var(--text-muted);font-size:12px;
    padding:6px 13px;border-radius:999px;cursor:pointer;font-family:var(--font);white-space:nowrap;}
  .pill-btn.active{border-color:var(--series-b);color:var(--series-b);font-weight:600;}
  .toolbar select, .toolbar .chk{
    font-family:var(--font);font-size:12px;padding:6px 10px;border-radius:var(--radius-btn);
    border:1px solid var(--btn-border);background:var(--surface-alt);color:var(--text-muted);
  }
  .toolbar .chk{display:flex;align-items:center;gap:6px;}
  .searchbox{flex:1;min-width:230px;display:flex;align-items:center;gap:6px;border:1px solid var(--btn-border);
    border-radius:var(--radius-btn);padding:6px 10px;background:var(--surface-alt);font-size:12px;color:var(--text-muted);}
  .searchbox-input{flex:1;min-width:230px;border:1px solid var(--btn-border);
    border-radius:var(--radius-btn);padding:7px 10px;background:var(--surface-alt);font-size:12px;color:var(--text);font-family:var(--font);}
  .prodcell{display:flex;gap:10px;align-items:flex-start;min-width:210px;}
  .prodcell .thumb{width:38px;height:38px;border-radius:6px;background:var(--surface);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;}
  .prodcell b{font-size:12.5px;display:block;}
  .prodcell .sub{font-size:10.8px;color:var(--text-muted);display:block;margin:2px 0 5px;}
  .prodcell .statusdot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);margin-bottom:5px;}
  .prodcell .statusdot i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;}
  .prodcell .tag{font-size:9.5px;border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--text-muted);margin-right:4px;}
  .diagcell{min-width:190px;}
  .diagcell .bad{color:var(--bad);font-weight:600;font-size:11.8px;display:block;margin-bottom:4px;line-height:1.35;}
  .diagcell .good{color:var(--ok);font-size:11.3px;display:block;margin-bottom:6px;}
  .deltacell .v{display:block;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .deltacell .d{display:block;font-size:10.8px;font-variant-numeric:tabular-nums;}
  .deltacell .d.up{color:var(--ok)} .deltacell .d.down{color:var(--bad)}

  /* ---- clickable rows + modal ---- */
  tr.clickable{cursor:pointer;}
  tr.clickable:hover td{background:var(--surface);}
  tr.clickable td:first-child{color:var(--accent);font-weight:600;}
  tr.clickable td:first-child::after{content:" ›"; opacity:.6; font-weight:400;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,14,20,.45); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:24px;
  }
  .modal-box{
    width:min(720px,100%); max-height:86%; overflow-y:auto; background:var(--surface-alt);
    border-radius:var(--radius-card); box-shadow:var(--shadow-window); border:1px solid var(--border-strong);
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px;
    border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface-alt);
  }
  .modal-head h3{margin:0;font-size:14.5px;}
  .modal-head span{font-size:11.5px;color:var(--text-muted);}
  .modal-close{
    width:28px;height:28px;border-radius:6px;border:1px solid var(--btn-border);background:var(--btn-bg);
    color:var(--btn-text);cursor:pointer;font-size:13px;flex:0 0 auto;
  }
  .modal-body{padding:16px 18px 20px;}
  .modal-body .note{font-size:11.5px;color:var(--text-muted);margin-top:10px;}
  .period-note{font-size:11px;color:var(--text-muted);}
  .period-note.flag{color:var(--warn);font-weight:600;}

  /* ---- Tour guiado (spotlight onboarding) ---- */
  .tour-clickcatch{position:fixed;inset:0;z-index:299;background:transparent;}
  .tour-spotlight{
    position:fixed;z-index:300;border-radius:10px;pointer-events:none;
    box-shadow:0 0 0 9999px rgba(8,10,14,.62);
    opacity:0;transition:top .28s cubic-bezier(.4,0,.2,1),left .28s cubic-bezier(.4,0,.2,1),
      width .28s cubic-bezier(.4,0,.2,1),height .28s cubic-bezier(.4,0,.2,1),opacity .18s ease;
  }
  .tour-spotlight.show{opacity:1;}
  .tour-card{
    position:fixed;z-index:301;width:min(320px,92vw);background:var(--surface-alt);
    border:1px solid var(--border-strong);border-radius:var(--radius-card);box-shadow:var(--shadow-window);
    padding:16px;opacity:0;transform:translateY(6px);pointer-events:none;
    transition:opacity .18s ease,transform .18s ease,top .28s cubic-bezier(.4,0,.2,1),left .28s cubic-bezier(.4,0,.2,1);
  }
  .tour-card.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .tour-card:focus{outline:none;}
  .tour-card .tour-step-indicator{font-size:11px;color:var(--text-muted);margin-bottom:8px;font-weight:600;letter-spacing:.02em;}
  .tour-card h4{margin:0 0 8px;font-size:14.5px;color:var(--text);}
  .tour-card p{margin:0 0 14px;font-size:12px;color:var(--text-muted);line-height:1.55;}
  .tour-card-actions{display:flex;flex-direction:column;gap:10px;}
  .tour-card-nav{display:flex;justify-content:flex-end;gap:8px;}
  .tour-skip{
    background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer;
    text-decoration:underline;padding:6px 2px;align-self:flex-start;font-family:var(--font);
  }
  .tour-skip:focus-visible, .tour-card .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .tour-arrow{
    position:absolute;width:12px;height:12px;background:var(--surface-alt);
    border:1px solid var(--border-strong);transform:rotate(45deg);
  }
  .tour-card[data-side="bottom"] .tour-arrow{top:-7px;left:50%;margin-left:-6px;border-right:none;border-bottom:none;}
  .tour-card[data-side="top"] .tour-arrow{bottom:-7px;left:50%;margin-left:-6px;border-left:none;border-top:none;}
  .tour-card[data-side="right"] .tour-arrow{left:-7px;top:50%;margin-top:-6px;border-top:none;border-right:none;}
  .tour-card[data-side="left"] .tour-arrow{right:-7px;top:50%;margin-top:-6px;border-bottom:none;border-left:none;}
  .tour-card[data-side="sheet"] .tour-arrow{display:none;}
  @media (max-width:640px){
    .tour-card{width:min(300px,90vw);padding:14px;}
    .tour-card[data-side="sheet"]{
      left:10px!important;right:10px!important;width:auto!important;bottom:12px!important;top:auto!important;
      border-radius:var(--radius-card);
    }
  }

  /* ---- Produtos (grid estilo Meus Produtos) ---- */
  .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;}
  .prodcard{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-card);
    box-shadow:var(--shadow-card);overflow:hidden;display:flex;flex-direction:column;}
  .prodcard .thumb-wrap{position:relative;aspect-ratio:1/1;background:var(--surface);display:flex;
    align-items:center;justify-content:center;font-size:34px;}
  .prodcard .thumb-wrap input[type=checkbox]{position:absolute;top:8px;left:8px;}
  .prodcard .off-badge{position:absolute;top:0;right:0;background:var(--bad);color:#fff;font-size:10px;
    font-weight:700;padding:3px 7px;border-bottom-left-radius:8px;}
  .prodcard .body{padding:10px 11px 8px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .prodcard .name{font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;min-height:2.6em;}
  .prodcard .price{font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
  .prodcard .stock{font-size:11px;color:var(--text-muted);}
  .prodcard .stats{display:flex;gap:10px;font-size:10.5px;color:var(--text-muted);margin-top:2px;}
  .prodcard .foot{display:flex;justify-content:flex-end;gap:4px;border-top:1px solid var(--border);padding:6px 8px;}
  .prodcard .foot button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:13px;padding:3px 6px;border-radius:5px;}
  .prodcard .foot button:hover{background:var(--surface);}
  .prodcard.pausado{opacity:.6;}
  .prodcard.pausado .thumb-wrap{filter:grayscale(.4);}
  .prod-grid.list-mode{grid-template-columns:1fr;}
  .prod-grid.list-mode .prodcard{flex-direction:row;align-items:stretch;}
  .prod-grid.list-mode .prodcard .thumb-wrap{width:64px;flex:0 0 64px;aspect-ratio:1/1;}
  .prod-grid.list-mode .prodcard .body{flex-direction:row;align-items:center;gap:14px;flex:1;}
  .prod-grid.list-mode .prodcard .name{min-height:0;-webkit-line-clamp:1;flex:1;}
  .prod-grid.list-mode .prodcard .stats{margin-top:0;}
  .prod-grid.list-mode .prodcard .foot{flex-direction:column;border-top:none;border-left:1px solid var(--border);justify-content:center;}

  /* ---- Menu de ações (usado no modal do "⋯" dos produtos) ---- */
  .actionlist{padding:6px;display:flex;flex-direction:column;gap:2px;}
  .opt-row{width:100%;display:flex;align-items:center;gap:12px;padding:10px 10px;border:none;background:none;
    border-radius:var(--radius-btn);cursor:pointer;text-align:left;font-family:var(--font);color:var(--text);}
  .opt-row:hover{background:var(--surface);}
  .opt-row .oic{font-size:16px;flex:0 0 auto;width:20px;text-align:center;}
  .opt-row .otxt b{display:block;font-size:12.8px;font-weight:600;}
  .opt-row .otxt span{display:block;font-size:11px;color:var(--text-muted);margin-top:1px;}
  .opt-row.danger .otxt b{color:var(--bad);}
  .sortline{font-size:11.5px;color:var(--text-muted);display:flex;gap:18px;}
  .pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:12px;color:var(--text-muted);}
  .pager b{color:var(--text);}
  .pager select{font-family:var(--font);font-size:12px;padding:4px 8px;margin-left:8px;border-radius:var(--radius-btn);
    border:1px solid var(--btn-border);background:var(--surface-alt);color:var(--text);}

  /* ---- Custo e Margem por Produto ---- */
  .tip-box{font-size:12px;line-height:1.5;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-card);padding:10px 14px;}
  .tip-box b{color:var(--text);}
  .minitoolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .minitoolbar .left{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .margincell{display:flex;align-items:center;gap:4px;}
  .margincell .cur{font-size:11.5px;color:var(--text-muted);}
  .margincell input{width:66px;font-family:var(--font);font-size:12.5px;padding:5px 7px;border-radius:var(--radius-btn);
    border:1px solid var(--btn-border);background:var(--surface-alt);color:var(--text);font-variant-numeric:tabular-nums;}
  .margem-none{color:var(--text-muted);font-size:11.8px;}
  .margem-val{font-weight:600;font-variant-numeric:tabular-nums;}
  .margem-val.ok{color:var(--ok);}
  .margem-val.bad{color:var(--bad);}
  .margem-pct{font-size:10.5px;color:var(--text-muted);margin-left:4px;}
  .stockcell{text-align:right;white-space:nowrap;}
  .expand-btn{background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;font-family:var(--font);padding:0;}
  .expand-btn:hover{color:var(--accent);}
  tr.variacao-row td{background:var(--surface);}
  tr.variacao-row .varlabel{padding-left:30px;color:var(--text-muted);font-size:11.8px;}
  .showing-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11.5px;color:var(--text-muted);}
  .showing-row select{font-family:var(--font);font-size:12px;padding:4px 8px;border-radius:var(--radius-btn);
    border:1px solid var(--btn-border);background:var(--surface-alt);color:var(--text);}

  /* ---- Dashboard Geral: ranking de produtos ---- */
  .ranklist{padding:6px 4px;}
  .rankrow{display:flex;align-items:center;gap:14px;padding:10px 12px;border-bottom:1px solid var(--border);}
  .rankrow:last-child{border-bottom:none;}
  .rankrow .rank{width:18px;text-align:center;font-size:12px;color:var(--text-muted);flex:0 0 auto;}
  .rankinfo{flex:1;min-width:0;}
  .rankinfo b{font-size:12.5px;display:block;}
  .rankinfo .sub{font-size:11px;color:var(--text-muted);}
  .rankbar{height:4px;background:var(--surface);border-radius:99px;margin-top:6px;overflow:hidden;}
  .rankbar i{display:block;height:100%;background:var(--accent);border-radius:99px;}
  .rankval{text-align:right;flex:0 0 auto;font-size:12.5px;white-space:nowrap;}
  .rankval span{display:block;font-size:11px;color:var(--text-muted);margin-top:2px;}

  /* ---- Financeiro: estrutura de custos ---- */
  .costitem{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-btn);padding:10px 12px;}
  .ci-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;}
  .ci-value{font-size:15px;font-weight:700;margin-top:4px;color:var(--bad);font-variant-numeric:tabular-nums;}
  .ci-value.pos{color:var(--text-muted);font-size:13px;}
  .ci-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .costbar-wrap{margin-top:14px;}
  .costbar{height:10px;border-radius:99px;overflow:hidden;display:flex;background:var(--surface);}
  .costbar .c1{background:var(--bad);height:100%;}
  .costbar .c2{background:var(--ok);height:100%;}
  .costbar-legend{display:flex;gap:16px;margin-top:8px;font-size:11.5px;color:var(--text-muted);}
  .costbar-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;}

  /* ---- Estratégias ---- */
  .strat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:1100px){.strat-grid{grid-template-columns:repeat(2,1fr);}}
  .stratcard{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-card);
    box-shadow:var(--shadow-card);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;}
  .stratcard.soon{cursor:default;opacity:.72;}
  .stratcard .sic{font-size:22px;}
  .stratcard h4{margin:0;font-size:13.5px;}
  .stratcard p{margin:0;font-size:11.8px;color:var(--text-muted);line-height:1.45;flex:1;}
  .stratcard .stratfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;}
  .stratcard .soon-link{font-size:11px;color:var(--accent);text-decoration:none;}
  .back-link{background:none;border:none;color:var(--accent);font-size:12.5px;cursor:pointer;font-family:var(--font);
    padding:0;display:inline-flex;align-items:center;gap:4px;align-self:flex-start;}
  .back-link:hover{text-decoration:underline;}
  .insight-card .stat-big{font-size:20px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums;}
  .insight-card .stat-sub{font-size:11px;color:var(--text-muted);margin-bottom:8px;}
  .insight-card .ministat{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;color:var(--text-muted);}
  .insight-card .ministat b{color:var(--text);font-variant-numeric:tabular-nums;}
  .heatmap-wrap{overflow-x:auto;}
  .heatmap{border-collapse:separate;border-spacing:3px;width:100%;font-size:10.8px;}
  .heatmap th{font-weight:600;color:var(--text-muted);padding:4px 6px;text-align:center;font-size:10.5px;}
  .heatmap th.rowhead{text-align:left;}
  .heatmap td{padding:8px 6px;text-align:center;border-radius:6px;min-width:52px;}
  .heatmap td.good{background:var(--ok-bg);color:var(--ok);font-weight:700;}
  .heatmap td.bad{background:var(--bad-bg);color:var(--bad);font-weight:700;}
  .heatmap td.none{background:var(--surface);color:var(--text-muted);}
  .heatmap .rowlabel{font-size:11px;color:var(--text-muted);white-space:nowrap;padding-right:8px;}

  /* ---- Atendimento / Chat: central de mensagens ---- */

    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto;}

  .chat-item .cinfo .clast{font-size:11.3px;color:var(--text-muted);display:block;white-space:nowrap;overflow:hidden;

<script>
(function(){
  "use strict";

  /* Checklist da revisão funcional completa (rodada de programação página a página, pedida pelo Otacilio):
     cada categoria começa "false" até passar pela auditoria (nenhum botão sem ação, dados cruzados quando fizer
     sentido, tudo testado) — aí vira "true" e some o marcador 🔧 do menu lateral. Serve só de controle visual
     de progresso; não afeta nenhuma lógica do sistema. */
  var PAGE_REVISADA = {
    dashboard:true, estrategias:true, produtos:true, pedidos:true, ads:true,
    historico:true, melhoria:true, seo:true, preco:true, concorrencia:true,
    financeiro:true, impostos:true, estoque:true, crescimento:true, atendimento:true,
    avaliacoes:true, logistica:true, saude:true, conteudo:true, promocoes:true,
    loja:true, "dashboard-geral":true
  };

  var THEMES = [
    {id:"xp",   name:"Windows XP",    era:"2001 · Luna Blue",   c1:"#2A66C9", c2:"#ECE9D8"},
    {id:"vista",name:"Windows Vista", era:"2007 · Aero Glass",  c1:"#1E7BC2", c2:"#EEF4FA"},
    {id:"win10",name:"Windows 10",    era:"2015 · Fluent flat", c1:"#0078D4", c2:"#1F1F1F"},
    {id:"win11",name:"Windows 11",    era:"2021 · Mica rounded",c1:"#0067C0", c2:"#F3F3F3"},
    {id:"ubuntu",name:"Ubuntu",       era:"Yaru · Aubergine",   c1:"#E95420", c2:"#2C0027"},
    {id:"aurora",name:"Aurora",       era:"2026 · Autoral · Recomendado", c1:"#C4623F", c2:"#2A2622"},
    {id:"gestor",name:"Gestor Senior",era:"Couro azul-marinho · Dourado", c1:"#071728", c2:"#D7AE58"}
  ];

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  /* ---------------- Widget builders ---------------- */
  function kpis(items, gridCls){
    var g = el("div","grid "+(gridCls||"cols-4"));
    items.forEach(function(k){
      var c = el("div","card kpi"+(k.hl?" hl-"+k.hl:""));
      c.innerHTML = '<div class="label">'+k.label+(k.tip?' <span class="qm" title="'+k.tip+'">?</span>':'')+'</div>'+
        '<div class="value">'+k.value+'</div>'+
        (k.delta ? '<div class="delta '+(k.tone||"up")+'">'+k.delta+'</div>' : '');
      g.appendChild(c);
    });
    return g;
  }

  function tabsRow(items, activeIdx){
    var d = el("div","tabs");
    items.forEach(function(t,i){ d.appendChild(el("button","tab"+(i===activeIdx?" active":""), t)); });
    return d;
  }

  function pillRow(items, activeIdx){
    var d = el("div","toolbar");
    items.forEach(function(t,i){ d.appendChild(el("button","pill-btn"+(i===activeIdx?" active":""), t)); });
    return d;
  }

  /* Dual-line chart in Shopee's own brand colors (fixed across OS themes) */
  function adsPerfChart(points){
    var d = el("div","card");
    var w = 900, h = 210, pad = 26;
    var maxA = Math.max.apply(null, points.map(function(p){return p.a;})) * 1.18;
    var maxB = Math.max.apply(null, points.map(function(p){return p.b;})) * 1.18;
    function x(i){ return pad + i*((w-pad*2)/(points.length-1)); }
    function yA(v){ return h-pad - (v/maxA)*(h-pad*1.5); }
    function yB(v){ return h-pad - (v/maxB)*(h-pad*1.5); }
    var gridLines = "";
    for(var i=0;i<4;i++){ var gy = pad + i*((h-pad*1.5)/3); gridLines += '<line x1="'+pad+'" y1="'+gy.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+gy.toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>'; }
    var labels = points.map(function(p,i){ if(i%2) return ""; return '<text x="'+x(i).toFixed(1)+'" y="'+(h-6)+'" font-size="9.5" fill="var(--text-muted)" text-anchor="middle">'+p.label+'</text>'; }).join("");
    function linePath(fn,key){ return points.map(function(p,i){ return (i===0?"M":"L")+x(i).toFixed(1)+","+fn(p[key]).toFixed(1); }).join(" "); }
    var svg = '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="display:block;max-width:100%;height:auto;">'+
      gridLines + labels +
      '<path d="'+linePath(yA,"a")+'" fill="none" stroke="var(--series-a)" stroke-width="2.2"/>'+
      '<path d="'+linePath(yB,"b")+'" fill="none" stroke="var(--series-b)" stroke-width="2.2"/>'+
      '</svg>';
    d.innerHTML = '<div style="display:flex;align-items:center;margin-bottom:4px;">'+
      '<span class="legend-dot"><i style="background:var(--series-a)"></i>Impressões</span>'+
      '<span class="legend-dot"><i style="background:var(--series-b)"></i>ROAS</span></div>'+svg;
    return d;
  }

  function alertBar(tone, icon, title, text, actions){
    var d = el("div","alertbar "+tone);
    d.innerHTML = '<div class="ic">'+icon+'</div><div class="body"><b>'+title+'</b><span>'+text+'</span></div>';
    if(actions && actions.length){
      var a = el("div","actions");
      actions.forEach(function(act){
        var btn = el("button","btn "+(act.primary?"primary":"ghost")+" sm", act.label);
        if(typeof act.onClick === "function") btn.addEventListener("click", act.onClick);
        a.appendChild(btn);
      });
      d.appendChild(a);
    }
    return d;
  }

  function table(headers, rows){
    var wrap = el("div","tablewrap");
    var t = el("table");
    var thead = el("thead");
    var trh = el("tr");
    headers.forEach(function(h){ trh.appendChild(el("th",null,h)); });
    thead.appendChild(trh); t.appendChild(thead);
    var tbody = el("tbody");
    rows.forEach(function(r){
      var tr = el("tr");
      r.forEach(function(cell){ var td = el("td",null,cell); tr.appendChild(td); });
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    wrap.appendChild(t);
    return wrap;
  }

  function chip(tone, text){ return '<span class="chip '+tone+'">'+text+'</span>'; }

  function productCard(p, onEdit, onMenu){
    var c = el("div","prodcard"+(p.pausado?" pausado":""));
    var thumb = el("div","thumb-wrap");
    thumb.innerHTML = (p.off ? '<span class="off-badge">'+p.off+' OFF</span>' : '') +
      '<input type="checkbox" title="Selecionar">' + '<span>'+p.icon+'</span>';
    c.appendChild(thumb);
    var body = el("div","body");
    body.innerHTML = '<div class="name">'+p.name+'</div>'+
      '<div class="price">'+p.price+'</div>'+
      '<div class="stock">'+(p.pausado ? '<span style="color:var(--warn);">⏸ Anúncio pausado</span>' : "Estoque "+p.stock)+'</div>'+
      '<div class="stats"><span>👁 '+p.views+'</span><span>♡ '+p.likes+'</span><span>🛒 '+p.carts+'</span></div>';
    c.appendChild(body);
    var foot = el("div","foot");
    foot.innerHTML = '<button class="fbtn-edit" title="Editar anúncio">✏️</button><button class="fbtn-menu" title="Mais opções">⋯</button>';
    c.appendChild(foot);
    if(onEdit){
      foot.querySelector(".fbtn-edit").addEventListener("click", function(){ onEdit(p); });
    }
    if(onMenu){
      foot.querySelector(".fbtn-menu").addEventListener("click", function(e){ e.stopPropagation(); onMenu(p); });
    }
    return c;
  }

  function productGrid(items, onEdit, onMenu){
    var g = el("div","prod-grid");
    items.forEach(function(p){ g.appendChild(productCard(p, onEdit, onMenu)); });
    return g;
  }

  /* Menu de ações reutilizável — lista de linhas clicáveis dentro de um modal (usado no "⋯" dos cards de produto). */
  function actionMenu(actions){
    var d = el("div","card actionlist");
    actions.forEach(function(a){
      var row = el("button","opt-row"+(a.danger?" danger":""));
      row.innerHTML = '<span class="oic">'+a.icon+'</span><span class="otxt"><b>'+a.label+'</b>'+(a.sub?'<span>'+a.sub+'</span>':'')+'</span>';
      row.addEventListener("click", a.onClick);
      d.appendChild(row);
    });
    return d;
  }

  /* Custo -> margem líquida: preço - taxas Shopee - frete subsidiado - (antecipação, se ativa) - imposto - custo.
     Parâmetros configuráveis na seção "Configurações de Custos" da página Precificação e Lucro. */
  var CUSTO_CONFIG = { taxaPerc:0.14, frete:6, antecipaAtivo:false, antecipaPerc:0.025, impostoPerc:0 };

  function fmtMoney(v){ return "R$ "+v.toFixed(2).replace(".",","); }

  function marginCalc(price, custo){
    custo = parseFloat(custo);
    if(!custo || custo<=0 || isNaN(custo)) return null;
    var liquido = price
      - price*CUSTO_CONFIG.taxaPerc
      - CUSTO_CONFIG.frete
      - (CUSTO_CONFIG.antecipaAtivo ? price*CUSTO_CONFIG.antecipaPerc : 0)
      - price*(CUSTO_CONFIG.impostoPerc/100)
      - custo;
    return {valor:liquido, perc:(liquido/price)*100};
  }

  function marginCell(price, custo){
    var m = marginCalc(price, custo);
    if(!m) return '<span class="margem-none">— preencha o custo</span>';
    var tone = m.valor > 0 ? "ok" : "bad";
    return '<span class="margem-val '+tone+'">'+fmtMoney(m.valor)+'</span><span class="margem-pct">'+m.perc.toFixed(0)+'%</span>';
  }

  function custoInputCell(custo){
    var wrap = el("div","margincell");
    wrap.innerHTML = '<span class="cur">R$</span><input type="number" step="0.01" min="0" value="'+((custo && custo>0)?custo.toFixed(2):"")+'" placeholder="0,00">';
    wrap.querySelector("input").addEventListener("click", function(e){ e.stopPropagation(); });
    return wrap;
  }

  function findByName(arr, name){
    for(var i=0;i<arr.length;i++){ if(arr[i].name===name) return arr[i]; }
    return null;
  }

  function radioGroup(label, options, selectedIdx, note){
    var d = el("div","field");
    var gname = "rg_"+Math.random().toString(36).slice(2);
    var opts = options.map(function(o,i){
      return '<label class="radio-opt"><input type="radio" name="'+gname+'" '+(i===selectedIdx?"checked":"")+'> '+o+'</label>';
    }).join("");
    d.innerHTML = '<label>'+label+'</label><div class="radio-group">'+opts+'</div>'+(note?'<div class="field-note">'+note+'</div>':'');
    return d;

  /* ---------------- Estoque: giro, cobertura e capital parado ---------------- */
  function estoqueSituacao(it){
    var cobertura = it.giroDia > 0 ? (it.estoque / it.giroDia) : (it.estoque > 0 ? Infinity : 0);
    if(it.estoque === 0) return {tag:"ruptura", cobertura:0, label:chip("bad","sem estoque")};
    if(cobertura <= 3) return {tag:"ruptura", cobertura:cobertura, label:chip("bad","ruptura em "+Math.max(1,Math.round(cobertura))+" dias")};
    if(cobertura <= 7) return {tag:"atencao", cobertura:cobertura, label:chip("warn","ruptura em "+Math.round(cobertura)+" dias")};
    if(cobertura >= 90 || (it.giroDia < 0.5 && it.estoque > 40)) return {tag:"parado", cobertura:cobertura, label:chip("neutral","capital parado")};
    return {tag:"saudavel", cobertura:cobertura, label:chip("ok","saudável")};
  }

  function estoqueTable(items, onChange){
    var wrap = el("div");
    var counts = {ruptura:0, atencao:0, parado:0, saudavel:0};
    items.forEach(function(it){ counts[estoqueSituacao(it).tag]++; });
    var pills = pillRow(["Todos "+items.length, "Ruptura ≤7 dias "+(counts.ruptura+counts.atencao), "Capital parado "+counts.parado], 0);
    wrap.appendChild(pills);

    var tblWrap = el("div","tablewrap");
    var t = el("table");
    t.innerHTML = '<thead><tr><th>Produto</th><th>Estoque</th><th>Giro/dia</th><th>Cobertura</th><th>Capital parado</th><th>Situação</th></tr></thead>';
    var tbody = el("tbody");
    var sorted = items.slice().sort(function(a,b){ return estoqueSituacao(a).cobertura - estoqueSituacao(b).cobertura; });
    sorted.forEach(function(it){
      var s = estoqueSituacao(it);
      var tr = el("tr","clickable-row");
      tr.dataset.tag = s.tag;
      tr.innerHTML =
        '<td><div class="prodcell"><div class="thumb">'+it.icon+'</div><b>'+it.name+'</b></div></td>'+
        '<td>'+it.estoque+'</td>'+
        '<td>'+it.giroDia.toFixed(1).replace(".",",")+'</td>'+
        '<td>'+(isFinite(s.cobertura) ? Math.round(s.cobertura)+" dias" : "—")+'</td>'+
        '<td>'+fmtMoney(it.estoque*it.custo)+'</td>'+
        '<td>'+s.label+'</td>';
      tr.addEventListener("click", function(){
        var body = el("div");
        body.innerHTML = '<div style="margin-bottom:10px;">Estoque atual: <b>'+it.estoque+'</b> un. · giro de '+it.giroDia.toFixed(1).replace(".",",")+' un./dia · cobertura de '+(isFinite(s.cobertura)?Math.round(s.cobertura)+" dias":"—")+'.</div>';
        if(s.tag==="ruptura" || s.tag==="atencao"){
          var alvoDias = 30;
          var sugestao = Math.max(0, Math.ceil(it.giroDia*alvoDias - it.estoque));
          var repBtn = el("button","btn sm primary","Marcar reposição recebida (+"+sugestao+" un.)");
          repBtn.addEventListener("click", function(){
            it.estoque += sugestao;
            closeModal();
            if(typeof onChange === "function") onChange();
          });
          body.appendChild(repBtn);
        }
        var precoBtn = el("button","btn sm ghost","Ver na Precificação e Lucro ›");
        precoBtn.style.marginLeft = "8px";
        precoBtn.addEventListener("click", function(){ closeModal(); go("preco"); });
        body.appendChild(precoBtn);
        openModal(it.name, "Situação: "+s.tag, body);
      });
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    tblWrap.appendChild(t);
    wrap.appendChild(tblWrap);

    var pillBtns = pills.querySelectorAll(".pill-btn");
    var filters = ["all","ruptura7","parado"];
    Array.prototype.forEach.call(pillBtns, function(btn, idx){
      btn.addEventListener("click", function(){
        Array.prototype.forEach.call(pillBtns, function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        var f = filters[idx];
        Array.prototype.forEach.call(tbody.querySelectorAll("tr"), function(row){
          var tag = row.dataset.tag;
          var show = f==="all" || (f==="ruptura7" && (tag==="ruptura"||tag==="atencao")) || (f==="parado" && tag==="parado");
          row.style.display = show ? "table-row" : "none";
        });
      });
    });
    return wrap;
  }

  /* ---------------- Análise de Concorrência: histórico de preço por concorrente ---------------- */
  function concorrenciaDeltaChip(c){
    if(c.dataMudanca === null) return chip("neutral","sem mudança");
    var delta = c.preco - c.precoAnterior;
    if(delta < -0.001) return chip("bad","▼ "+fmtMoney(Math.abs(delta))+" em "+c.dataMudanca);
    if(delta > 0.001) return chip("ok","▲ "+fmtMoney(delta)+" em "+c.dataMudanca);
    return chip("neutral","sem mudança");
  }

  function concorrenciaTable(entry){
    var rows = entry.concorrentes.map(function(c){
      return [c.name, fmtMoney(c.preco), concorrenciaDeltaChip(c), "#"+c.posicao, String(c.vendas30d), chip(c.ads?"ok":"neutral", c.ads?"sim":"não")];
    });
    return table(["Concorrente","Preço","Variação","Posição na busca","Vendas/30d","Ads?"], rows);
  }

  function concorrenciaTimeline(entry){
    var eventos = entry.concorrentes.filter(function(c){return c.dataMudanca;}).map(function(c){
      var delta = c.preco - c.precoAnterior;
      return {icon: delta<0 ? "🔻" : "🔺",
        title: c.name+" "+(delta<0?"baixou":"subiu")+" de "+fmtMoney(c.precoAnterior)+" para "+fmtMoney(c.preco),
        sub: c.dataMudanca,
        meta: delta<0 ? chip("bad","ameaça") : chip("ok","oportunidade")};
    });
    if(!eventos.length) return el("div","empty-note","Nenhuma mudança de preço registrada pra este produto no período.");
    return rowList(eventos);
  }

  /* ---------------- Oportunidades de Crescimento: plano de compra ---------------- */
  function planoCompra(ranking){
    var rows = ranking.map(function(r){
      var est = findByName(ESTOQUE_PRODUTOS, r.produto);
      var diasAlvo = r.score>=90 ? 45 : r.score>=80 ? 30 : 15;
      var sugestao = est ? Math.max(0, Math.ceil(est.giroDia*diasAlvo - est.estoque)) : null;
      var investimento = (est && sugestao!=null) ? fmtMoney(sugestao*est.custo) : "—";
      return [r.produto, "Score "+r.score, est ? String(est.estoque) : "—", diasAlvo+" dias", sugestao!=null ? sugestao+" un." : "—", investimento];
    });
    return table(["Produto","Potencial","Estoque atual","Cobertura alvo","Sugestão de compra","Investimento estimado"], rows);

  /* Cruza dados que já existem em outras páginas (concorrência, estoque, ranking de crescimento)
     pra sugerir a ação mais relevante do dia — no lugar dos cards de upsell (Ads/Recarga Automática)
     que a própria Shopee mostra na home real. */
  function oportunidadesDoDia(){
    var nodes = [];

    var ameacaEntry = null, ameacaConc = null;
    for(var i=0;i<CONCORRENCIA_PRODUTOS.length && !ameacaConc;i++){
      var entry = CONCORRENCIA_PRODUTOS[i];
      for(var j=0;j<entry.concorrentes.length;j++){
        var c = entry.concorrentes[j];
        if(c.dataMudanca && (c.preco - c.precoAnterior) < 0){ ameacaEntry = entry; ameacaConc = c; break; }
      }
    }
    if(ameacaConc){
      var bar1 = alertBar("warn","🕵️", ameacaEntry.name+" — "+ameacaConc.name+" baixou o preço",
        "De "+fmtMoney(ameacaConc.precoAnterior)+" para "+fmtMoney(ameacaConc.preco)+" em "+ameacaConc.dataMudanca+". Vale ver o diagnóstico de reprecificação.",
        [{label:"Ver diagnóstico ›",primary:true}]);
      var btn1 = bar1.querySelector(".actions .primary");
      if(btn1) btn1.addEventListener("click", function(){ go("preco"); });
      nodes.push(bar1);
    }

    var rupturas = ESTOQUE_PRODUTOS.filter(function(it){ return estoqueSituacao(it).tag==="ruptura"; });
    if(rupturas.length){
      var it0 = rupturas[0]; var s0 = estoqueSituacao(it0);
      var bar2 = alertBar("bad","📦", it0.name+" está perto da ruptura",
        (s0.cobertura<=0 ? "Estoque zerado — pode estar perdendo venda agora." : "Cobertura de só "+Math.max(1,Math.round(s0.cobertura))+" dia(s) no ritmo de giro atual.")+
        (rupturas.length>1 ? " +"+(rupturas.length-1)+" outro(s) produto(s) na mesma situação." : ""),
        [{label:"Ver estoque ›",primary:true}]);
      var btn2 = bar2.querySelector(".actions .primary");
      if(btn2) btn2.addEventListener("click", function(){ go("estoque"); });
      nodes.push(bar2);
    }

    var top = CRESCIMENTO_RANKING[0];
    if(top){
      var bar3 = alertBar("ok","🚀", top.produto+" é o maior potencial de escala agora",
        "Score "+top.score+" · margem "+top.margem+" · concorrência "+top.concorrencia+". Tem plano de compra sugerido pronto.",
        [{label:"Ver plano de compra ›",primary:true}]);
      var btn3 = bar3.querySelector(".actions .primary");
      if(btn3) btn3.addEventListener("click", function(){ go("crescimento"); });
      nodes.push(bar3);
    }

    if(!nodes.length) nodes.push(el("div","empty-note","Sem oportunidades novas pra destacar hoje."));
    return nodes;
  }

     concorrente que baixou preço e cupom expirando — cada item marcado com a categoria (cat) dele. */
  function getNotificacoes(){
    var items = [];

    CONVERSAS.filter(function(c){ return c.unread; }).forEach(function(c){
      var last = c.messages[c.messages.length-1];
      items.push({cat:"mensagens", icon:"💬", text:c.buyer+": \""+last.text+"\"", sub:"Atendimento / Chat", goTo:"atendimento"});
    });

    var aEnviar = PEDIDOS.filter(function(o){ return o.status==="a_enviar"; });
    if(aEnviar.length){
      items.push({cat:"pedidos", icon:"📦", text:aEnviar.length+" pedido(s) aguardando envio", sub:"Meus Pedidos", goTo:"pedidos"});
    }

    var anunciosFracos = MELHORIA_ANUNCIOS.filter(function(a){ return a.nota < 7 || a.paradoDias > 7; })
      .sort(function(a,b){ return a.nota - b.nota; });
    if(anunciosFracos.length){
      items.push({cat:"anuncios", icon:"📣", text:anunciosFracos[0].name+(anunciosFracos.length>1?" +"+(anunciosFracos.length-1)+" outro(s)":"")+" com nota baixa no anúncio", sub:"Melhoria de Anúncio", goTo:"melhoria"});
    }

    var rupturas = ESTOQUE_PRODUTOS.filter(function(it){ return estoqueSituacao(it).tag==="ruptura"; });
    if(rupturas.length){
      items.push({cat:"estoque", icon:"📉", text:rupturas[0].name+(rupturas.length>1?" +"+(rupturas.length-1)+" outro(s)":"")+" perto da ruptura", sub:"Estoque", goTo:"estoque"});
    }

    var ameacaEntry = null, ameacaConc = null;
    for(var i=0;i<CONCORRENCIA_PRODUTOS.length && !ameacaConc;i++){
      var entry = CONCORRENCIA_PRODUTOS[i];
      for(var j=0;j<entry.concorrentes.length;j++){
        var c2 = entry.concorrentes[j];
        if(c2.dataMudanca && (c2.preco - c2.precoAnterior) < 0){ ameacaEntry = entry; ameacaConc = c2; break; }
      }
    }
    if(ameacaConc){
      items.push({cat:"concorrencia", icon:"🕵️", text:ameacaConc.name+" baixou o preço de "+ameacaEntry.name, sub:"Análise de Concorrência", goTo:"preco"});
    }

    items.push({cat:"promocoes", icon:"🏷️", text:"Cupom FRETE10 expira amanhã", sub:"Promoções e Ofertas", goTo:"promocoes"});

    return items;
  }

  /* Ranking de produtos com barra proporcional (usado no Dashboard Geral) */
  function rankedProductList(items){
    var d = el("div","card ranklist");
    var maxVal = Math.max.apply(null, items.map(function(it){return it.valor;}));
    items.forEach(function(it,i){
      var pct = Math.max(6, Math.round((it.valor/maxVal)*100));
      var row = el("div","rankrow");
      row.innerHTML =
        '<span class="rank">'+(i+1)+'</span>'+
        '<div class="rankinfo"><b>'+it.name+'</b><span class="sub">'+it.sub+'</span>'+
          '<div class="rankbar"><i style="width:'+pct+'%"></i></div></div>'+
        '<div class="rankval"><b>'+fmtMoney(it.valor)+'</b>'+
          (it.margem!=null ? '<span>Margem: '+fmtMoney(it.margem)+'</span>' : '<span class="margem-none">sem custo</span>')+'</div>';
      d.appendChild(row);
    });
    return d;
  }

  /* Bloco de composição de custos com barra empilhada Custos x Margem (usado no Financeiro) */
  function costBreakdown(items, custosPerc, margemPerc){
    var d = el("div","card");
    var grid = el("div","grid cols-3");
    items.forEach(function(it){
      var c = el("div","costitem");
      c.innerHTML = '<div class="ci-label">'+it.icon+' '+it.label+'</div>'+
        '<div class="ci-value'+(it.muted?" pos":"")+'">'+(it.text ? it.text : ("- "+fmtMoney(it.value)))+'</div>'+
        '<div class="ci-sub">'+it.sub+'</div>';
      grid.appendChild(c);
    });
    d.appendChild(grid);
    var barWrap = el("div","costbar-wrap");
    barWrap.innerHTML = '<div class="costbar"><i class="c1" style="width:'+custosPerc+'%"></i><i class="c2" style="width:'+margemPerc+'%"></i></div>'+
      '<div class="costbar-legend"><span><i style="background:var(--bad)"></i>Custos '+custosPerc+'%</span>'+
      '<span><i style="background:var(--ok)"></i>Margem '+margemPerc+'%</span></div>';
    d.appendChild(barWrap);
    return d;
  }

  /* Tabela "Produtos com ADS ativo": investimento, margem, ROAS/ACOS por produto, com filtro por tipo de campanha */
  function adsProdutosTable(items){
    var wrap = el("div");
    var countCPC = items.filter(function(i){return i.tipo==="CPC";}).length;
    var countGMV = items.filter(function(i){return i.tipo==="GMV Max";}).length;
    var pills = pillRow(["Todos "+items.length, "CPC "+countCPC, "GMV Max "+countGMV], 0);
    wrap.appendChild(pills);

    var tblWrap = el("div","tablewrap");
    var t = el("table");
    t.innerHTML = '<thead><tr><th>Produto</th><th>Investimento ↓</th><th>Margem</th><th>Margem/Venda</th><th>Vendas</th>'+
      '<th>Conversão</th><th>Receita</th><th>Custo/Venda</th><th>Cliques</th><th>CTR</th><th>ROAS</th><th>ACOS</th></tr></thead>';
    var tbody = el("tbody");
    var sorted = items.slice().sort(function(a,b){ return b.investimento - a.investimento; });
    sorted.forEach(function(it){
      var tr = el("tr");
      tr.dataset.tipo = it.tipo;
      var margemVenda = it.vendas>0 ? it.margem/it.vendas : 0;
      var hasRoas = it.roas > 0;
      var acos = hasRoas ? (100/it.roas) : 0;
      var margemTone = it.margem >= 0 ? "ok" : "bad";
      tr.innerHTML =
        '<td><b>'+it.name+'</b></td>'+
        '<td>'+fmtMoney(it.investimento)+'</td>'+
        '<td><span class="margem-val '+margemTone+'">'+(it.margem<0?"-":"")+fmtMoney(Math.abs(it.margem))+'</span>'+(it.margem<0?' ⚠️':'')+'</td>'+
        '<td>'+fmtMoney(margemVenda)+'</td>'+
        '<td>'+it.vendas+'</td>'+
        '<td>'+it.conversao.toFixed(2).replace(".",",")+'%</td>'+
        '<td>'+fmtMoney(it.receita)+'</td>'+
        '<td>'+fmtMoney(it.custoVenda)+'</td>'+
        '<td>'+it.cliques+'</td>'+
        '<td>'+it.ctr.toFixed(2).replace(".",",")+'%</td>'+
        '<td>'+(hasRoas ? it.roas.toFixed(2).replace(".",",")+'x' : '<span class="margem-none">—</span>')+'</td>'+
        '<td>'+(hasRoas ? acos.toFixed(2).replace(".",",")+'%' : '<span class="margem-none">—</span>')+'</td>';
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    tblWrap.appendChild(t);
    wrap.appendChild(tblWrap);

    var pillBtns = pills.querySelectorAll(".pill-btn");
    var filters = ["all","CPC","GMV Max"];
    Array.prototype.forEach.call(pillBtns, function(btn, idx){
      btn.addEventListener("click", function(){
        Array.prototype.forEach.call(pillBtns, function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        var f = filters[idx];
        Array.prototype.forEach.call(tbody.querySelectorAll("tr"), function(row){
          row.style.display = (f==="all" || row.dataset.tipo===f) ? "table-row" : "none";
        });
      });
    });

    return wrap;
  }

  function togglePanel(rows){
    var d = el("div","card togglepanel");
    rows.forEach(function(r, idx){
      var row = el("div","row");
      var id = "sw_"+Math.random().toString(36).slice(2);
      row.innerHTML = '<div class="txt"><b>'+r.label+'</b><span class="tog-sub">'+r.sub+'</span></div>'+
        '<label class="switch"><input type="checkbox" '+(r.on?"checked":"")+(r.disabled?" disabled":"")+' id="'+id+'"><span class="track"><span class="thumb"></span></span></label>';
      if(r.disabled) row.style.opacity = ".55";
      var input = row.querySelector("input");
      var subEl = row.querySelector(".tog-sub");
      input.addEventListener("change", function(){
        if(r.data) r.data[r.key] = this.checked;
        if(typeof r.onChange === "function") r.onChange(this.checked, subEl);
        else if(r.subOn && r.subOff) subEl.textContent = this.checked ? r.subOn : r.subOff;
      });
      d.appendChild(row);
    });
    return d;
  }

  function fieldRow(fields){
    var d = el("div","card");
    var fr = el("div","fieldrow");
    fields.forEach(function(f){
      var w = el("div","field");
      var inputHtml = f.type === "select"
        ? '<select>'+f.options.map(function(o){return '<option'+(o===f.value?' selected':'')+'>'+o+'</option>';}).join("")+'</select>'
        : '<input type="'+(f.type||"text")+'" value="'+(f.value||"")+'">';
      w.innerHTML = '<label>'+f.label+'</label>'+inputHtml;
      fr.appendChild(w);
    });
    d.appendChild(fr);
    return d;
  }

  function chartCard(title, sub, points, labelA, labelB){
    labelA = labelA || "vendas"; labelB = labelB || "gasto ads";
    var d = el("div","card");
    var w = 560, h = 190, pad = 30;
    var maxV = Math.max.apply(null, points.map(function(p){return Math.max(p.vendas,p.ads);})) * 1.15;
    function x(i){ return pad + i*((w-pad*2)/(points.length-1)); }
    function y(v){ return h-pad - (v/maxV)*(h-pad*1.4); }
    function path(key){
      return points.map(function(p,i){ return (i===0?"M":"L")+x(i).toFixed(1)+","+y(p[key]).toFixed(1); }).join(" ");
    }
    var gridLines = "";
    for(var i=0;i<4;i++){ var gy = pad + i*((h-pad*1.4)/3); gridLines += '<line x1="'+pad+'" y1="'+gy.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+gy.toFixed(1)+'" class="chart-grid"/>'; }
    var labels = points.map(function(p,i){ return '<text x="'+x(i).toFixed(1)+'" y="'+(h-8)+'" class="chart-label" text-anchor="middle">'+p.label+'</text>'; }).join("");
    var lastIdx = points.length-1;
    var svg = '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="display:block;max-width:100%;height:auto;">'+
      '<style>.chart-grid{stroke:var(--border);stroke-width:1}.chart-label{font-size:10px;fill:var(--text-muted)}'+
      '.line-vendas{fill:none;stroke:var(--accent);stroke-width:2.5}'+
      '.area-vendas{fill:var(--accent);opacity:.12}'+
      '.line-ads{fill:none;stroke:var(--text-muted);stroke-width:2;stroke-dasharray:4 3}'+
      '.pt{fill:var(--accent);stroke:var(--surface-alt);stroke-width:2}</style>'+
      gridLines + labels +
      '<path class="area-vendas" d="'+path("vendas")+' L'+x(lastIdx).toFixed(1)+','+(h-pad)+' L'+x(0).toFixed(1)+','+(h-pad)+' Z"/>'+
      '<path class="line-ads" d="'+path("ads")+'"/>'+
      '<path class="line-vendas" d="'+path("vendas")+'"/>'+
      points.map(function(p,i){ return '<circle class="pt" r="3.2" cx="'+x(i).toFixed(1)+'" cy="'+y(p.vendas).toFixed(1)+'"/>'; }).join("") +
      '<circle r="4" cx="'+x(lastIdx).toFixed(1)+'" cy="'+y(points[lastIdx].vendas).toFixed(1)+'" fill="var(--accent)" stroke="var(--surface-alt)" stroke-width="2"/>'+
      '</svg>';
    d.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">'+
      '<div><b style="font-size:13px;">'+title+'</b><div style="font-size:11.5px;color:var(--text-muted);">'+sub+'</div></div>'+
      '<div style="font-size:11px;color:var(--text-muted);display:flex;gap:12px;">'+
      '<span>▬ '+labelA+'</span><span>┄ '+labelB+'</span></div></div>'+svg;
    return d;
  }

  /* ---------------- Modal ---------------- */
  var modalRoot = el("div"); modalRoot.id = "modalRoot";

  function closeModal(){ modalRoot.innerHTML = ""; }

  function openModal(title, sub, bodyNode){
    /* modalRoot lives inside #app so it inherits the active theme's CSS variables (data-os scoping) */
    var appEl = document.getElementById("app");
    if(appEl && modalRoot.parentElement !== appEl) appEl.appendChild(modalRoot);
    modalRoot.innerHTML = "";
    var overlay = el("div","modal-overlay");
    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    var box = el("div","modal-box");
    var head = el("div","modal-head");
    head.innerHTML = '<div><h3>'+title+'</h3><span>'+sub+'</span></div>';
    var closeBtn = el("button","modal-close","✕");
    closeBtn.addEventListener("click", closeModal);
    head.appendChild(closeBtn);
    box.appendChild(head);
    var body = el("div","modal-body");
    body.appendChild(bodyNode);
    box.appendChild(body);
    overlay.appendChild(box);
    modalRoot.appendChild(overlay);
  }

  /* slug estável a partir do título da seção — usado como alvo dos passos do tour guiado,
     sem precisar marcar cada seção manualmente (ver TUTORIAIS/Tour mais abaixo) */
  function slugify(str){
    return String(str).toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  }

  function section(title, icon, nodes){
    var s = el("section","section framed");
    s.setAttribute("data-tour-section", slugify(title));
    s.appendChild(el("h2",null,'<span class="ic">'+icon+'</span>'+title));
    nodes.forEach(function(n){ s.appendChild(n); });
    return s;
  }
