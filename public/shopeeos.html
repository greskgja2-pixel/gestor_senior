  function buildTourSteps(catId){
    var base = TUTORIAIS[catId];
    if(!base) return [];
    var steps = [{target:'.page-head h1', title: base.titulo, description: base.texto}];
    var extra = TOUR_EXTRA_STEPS[catId];
    if(extra && extra.length) steps = steps.concat(extra);
    return steps;
  }

  /* ---------------- Tour guiado (spotlight onboarding, estilo tour de SaaS) ----------------
     Componente único e centralizado (arquitetura tipo TutorialProvider): páginas só fornecem
     passos (TOUR_EXTRA_STEPS acima); toda a lógica de overlay, spotlight, posicionamento,
     scroll, resize, teclado e persistência mora aqui dentro. */
  var Tour = (function(){
    var TOUR_VERSION = 1; // suba pra 2, 3... se o conteúdo de um tour mudar muito e você quiser reexibir pra quem já viu
    var state = { open:false, id:null, steps:[], stepIndex:0, target:null, lastFocus:null, scrollTimer:null, resizeObs:null };
    var root, clickcatch, spotlight, card;

    function storageKey(id){ return "shopeeos_tour_"+id+"_v"+TOUR_VERSION+"_done"; }
    function hasSeen(id){ try{ return localStorage.getItem(storageKey(id)) === "1"; }catch(e){ return false; } }
    function markSeen(id){ try{ localStorage.setItem(storageKey(id), "1"); }catch(e){} }
    function resetSeen(id){ try{ localStorage.removeItem(storageKey(id)); }catch(e){} }
    function resetAllSeen(){
      try{
        Object.keys(localStorage).forEach(function(k){
          if(k.indexOf("shopeeos_tour_")===0 && k.slice(-5)==="_done") localStorage.removeItem(k);
        });
      }catch(e){}
    }

    function ensureRoot(){
      var appEl = document.getElementById("app");
      if(!root){ root = el("div"); root.id = "tourRoot"; }
      if(appEl && root.parentElement !== appEl) appEl.appendChild(root);
    }

    function buildChrome(){
      root.innerHTML = "";
      clickcatch = el("div","tour-clickcatch");
      spotlight = el("div","tour-spotlight");
      card = el("div","tour-card");
      card.setAttribute("role","dialog");
      card.setAttribute("aria-modal","true");
      card.setAttribute("tabindex","-1");
      root.appendChild(clickcatch);
      root.appendChild(spotlight);
      root.appendChild(card);
    }

    function currentStepDef(){ return state.steps[state.stepIndex]; }

    /* Localiza o elemento-alvo com algumas tentativas (a interface pode ainda estar renderizando);
       se realmente não existir, quem chamou decide pular pro próximo passo — nunca trava o tour. */
    function findTarget(selector, cb, triesLeft){
      triesLeft = triesLeft === undefined ? 6 : triesLeft;
      var found = null;
      try{ found = selector ? document.querySelector(selector) : null; }catch(e){ found = null; }
      if(found){ cb(found); return; }
      if(triesLeft <= 0){ cb(null); return; }
      setTimeout(function(){ findTarget(selector, cb, triesLeft-1); }, 120);
    }

    function start(id, opts){
      opts = opts || {};
      var steps = buildTourSteps(id);
      if(!steps.length) return;
      teardown();
      state.open = true; state.id = id; state.steps = steps; state.stepIndex = 0;
      state.lastFocus = document.activeElement;
      ensureRoot();
      buildChrome();
      document.addEventListener("keydown", onKeydown);
      window.addEventListener("resize", onReposition);
      window.addEventListener("orientationchange", onReposition);
      window.addEventListener("scroll", onReposition, true);
      renderStep();
    }

    function renderStep(){
      var step = currentStepDef();
      if(!step){ complete(); return; }
      findTarget(step.target, function(targetEl){
        if(!state.open) return;
        if(!targetEl){
          if(state.stepIndex < state.steps.length - 1){ state.stepIndex++; renderStep(); }
          else complete();
          return;
        }
        state.target = targetEl;
        clickcatch.style.pointerEvents = step.interactive ? "none" : "auto";
        targetEl.scrollIntoView({behavior:"smooth", block:"center"});
        clearTimeout(state.scrollTimer);
        state.scrollTimer = setTimeout(function(){
          if(!state.open) return;
          fillCard(step);
          positionAll();
          observeTarget(targetEl);
          requestAnimationFrame(function(){
            spotlight.classList.add("show");
            card.classList.add("show");
            card.focus();
          });
        }, 320);
      });
    }

    function fillCard(step){
      var total = state.steps.length, idx = state.stepIndex;
      card.classList.remove("show");
      card.innerHTML = "";
      card.appendChild(el("div","tour-step-indicator", "Etapa "+(idx+1)+" de "+total));
      card.appendChild(el("h4",null, step.title));
      card.appendChild(el("p",null, step.description));

      var actions = el("div","tour-card-actions");
      var nav = el("div","tour-card-nav");
      if(idx > 0){
        var prevBtn = el("button","btn sm ghost","Anterior");
        prevBtn.type = "button";
        prevBtn.setAttribute("aria-label","Etapa anterior");
        prevBtn.addEventListener("click", prevStep);
        nav.appendChild(prevBtn);
      }
      var nextBtn = el("button","btn sm primary", idx === total-1 ? "Concluir" : "Próximo");
      nextBtn.type = "button";
      nextBtn.setAttribute("aria-label", idx === total-1 ? "Concluir tutorial" : "Próxima etapa");
      nextBtn.addEventListener("click", function(){ if(idx === total-1) complete(); else nextStep(); });
      nav.appendChild(nextBtn);
      actions.appendChild(nav);
      card.appendChild(actions);

      var skipBtn = el("button","tour-skip","Pular tutorial");
      skipBtn.type = "button";
      skipBtn.setAttribute("aria-label","Pular tutorial");
      skipBtn.addEventListener("click", skip);
      card.appendChild(skipBtn);

      var arrow = el("div","tour-arrow");
      card.appendChild(arrow);
      card.setAttribute("aria-label", step.title);
    }

    function positionAll(){
      if(!state.open || !state.target) return;
      var rect = state.target.getBoundingClientRect();
      var pad = 8;
      spotlight.style.top = (rect.top - pad) + "px";
      spotlight.style.left = (rect.left - pad) + "px";
      spotlight.style.width = (rect.width + pad*2) + "px";
      spotlight.style.height = (rect.height + pad*2) + "px";
      positionCard(rect);
    }

    function positionCard(rect){
      var vw = window.innerWidth, vh = window.innerHeight, margin = 12, gap = 14;
      var isMobile = vw <= 640;
      // mede o card (já está no DOM, só ainda não posicionado/visível — offsetWidth funciona mesmo com opacity:0)
      var cw = card.offsetWidth || 300, ch = card.offsetHeight || 140;

      function clamp(v, min, max){ return Math.max(min, Math.min(v, max)); }

      var candidates = {
        bottom: function(){
          var top = rect.bottom + gap;
          var left = clamp(rect.left + rect.width/2 - cw/2, margin, Math.max(margin, vw - cw - margin));
          return {top:top, left:left, fits: (top + ch) <= (vh - margin)};
        },
        top: function(){
          var top = rect.top - gap - ch;
          var left = clamp(rect.left + rect.width/2 - cw/2, margin, Math.max(margin, vw - cw - margin));
          return {top:top, left:left, fits: top >= margin};
        },
        right: function(){
          var left = rect.right + gap;
          var top = clamp(rect.top + rect.height/2 - ch/2, margin, Math.max(margin, vh - ch - margin));
          return {top:top, left:left, fits: (left + cw) <= (vw - margin)};
        },
        left: function(){
          var left = rect.left - gap - cw;
          var top = clamp(rect.top + rect.height/2 - ch/2, margin, Math.max(margin, vh - ch - margin));
          return {top:top, left:left, fits: left >= margin};
        },
      };

      var order = isMobile ? ["bottom","top"] : ["bottom","top","right","left"];
      var chosen = null, chosenSide = null;
      for(var i=0;i<order.length;i++){
        var side = order[i];
        var c = candidates[side]();
        if(c.fits){ chosen = c; chosenSide = side; break; }
      }
      if(!chosen){
        if(isMobile){
          // bottom-sheet: fixo na parte de baixo da tela, nunca cortado nem fora da viewport
          chosenSide = "sheet";
          chosen = {top: vh - ch - margin, left: margin};
        } else {
          // melhor esforço: usa 'bottom' e trava dentro da viewport
          var fb = candidates.bottom();
          fb.top = clamp(fb.top, margin, Math.max(margin, vh - ch - margin));
          chosen = fb; chosenSide = "bottom";
        }
      }
      card.setAttribute("data-side", chosenSide);
      if(chosenSide !== "sheet"){
        card.style.top = chosen.top + "px";
        card.style.left = chosen.left + "px";
      } else {
        card.style.top = ""; card.style.left = ""; // CSS mobile cuida do sheet (bottom/left/right fixos)
      }
    }

    function onReposition(){
      if(!state.open) return;
      requestAnimationFrame(positionAll);
    }

    function observeTarget(targetEl){
      if(state.resizeObs){ state.resizeObs.disconnect(); state.resizeObs = null; }
      if(typeof ResizeObserver === "function"){
        state.resizeObs = new ResizeObserver(function(){ onReposition(); });
        state.resizeObs.observe(targetEl);
        var pageEl = document.getElementById("page");
        if(pageEl) state.resizeObs.observe(pageEl);
      }
    }

    function nextStep(){
      if(state.stepIndex < state.steps.length - 1){ state.stepIndex++; renderStep(); }
      else complete();
    }
    function prevStep(){
      if(state.stepIndex > 0){ state.stepIndex--; renderStep(); }
    }
    function skip(){ markSeen(state.id); teardown(); }
    function complete(){ markSeen(state.id); teardown(); }

    function onKeydown(e){
      if(!state.open) return;
      if(e.key === "Escape"){ e.preventDefault(); skip(); }
      else if(e.key === "ArrowRight" || e.key === "Enter"){ e.preventDefault(); nextStep(); }
      else if(e.key === "ArrowLeft"){ e.preventDefault(); prevStep(); }
    }

    function teardown(){
      var wasOpen = state.open;
      state.open = false;
      clearTimeout(state.scrollTimer);
      if(state.resizeObs){ state.resizeObs.disconnect(); state.resizeObs = null; }
      document.removeEventListener("keydown", onKeydown);
      window.removeEventListener("resize", onReposition);
      window.removeEventListener("orientationchange", onReposition);
      window.removeEventListener("scroll", onReposition, true);
      if(root) root.innerHTML = "";
      if(wasOpen && state.lastFocus && typeof state.lastFocus.focus === "function"){
        try{ state.lastFocus.focus(); }catch(e){}
      }
      state.target = null;
    }

    function restart(id){ resetSeen(id); start(id, {auto:false}); }

    function autoStartIfNeeded(id){
      if(!TUTORIAIS[id]) return;
      if(!hasSeen(id)) start(id, {auto:true});
    }

    /* Fecha um tour em andamento sem marcar como "visto" — usado quando o sistema precisa
       encerrar o tour por conta própria (ex.: o usuário navegou pra outra página no meio do
       tour), diferente de skip()/complete(), que são escolhas explícitas do usuário. */
    function dismiss(){ if(state.open) teardown(); }

    return {
      start:start, restart:restart, skip:skip, complete:complete, dismiss:dismiss,
      nextStep:nextStep, prevStep:prevStep,
      hasSeen:hasSeen, resetSeen:resetSeen, resetAllSeen:resetAllSeen,
      autoStartIfNeeded:autoStartIfNeeded,
    };
  })();

  var shopeeDataState = {connected:false, products:false, orders:false};

  function safeText(value){
    return String(value == null ? "" : value).replace(/[&<>]/g, function(ch){
      return {"&":"&amp;","<":"&lt;",">":"&gt;"}[ch];
    });
  }
  function moneyText(value){
    var n = Number(value);
    return isFinite(n) ? "R$ "+n.toFixed(2).replace(".",",") : "—";
  }
  function productIcon(item){
    var name = String(item.item_name || "").toLowerCase();
    if(name.indexOf("cabo") >= 0) return "🔌";
    if(name.indexOf("carreg") >= 0) return "🔋";
    if(name.indexOf("controle") >= 0) return "📺";
    if(name.indexOf("suporte") >= 0) return "🖥️";
    if(name.indexOf("fone") >= 0 || name.indexOf("audio") >= 0) return "🎧";
    return "📦";
  }
  function productStatus(item){
    var status = String(item.item_status || "").toUpperCase();
    if(status === "NORMAL") return "ativo";
    if(status === "BANNED" || status === "UNLIST") return "violacao";
    if(status === "DELETE") return "naopublicado";
    return "analise";
  }
  function mapShopeeProducts(items){
    return items.map(function(item){
      var priceInfo = item.price_info && item.price_info[0];
      var current = priceInfo && priceInfo.current_price;
      var original = priceInfo && priceInfo.original_price;
      var stockInfo = item.stock_info_v2 && item.stock_info_v2.summary_info;
      return {
        name:safeText(item.item_name || "Produto sem nome"), icon:productIcon(item), off:null,
        price:current == null ? "—" : moneyText(current)+(original && Number(original)>Number(current) ? " · de "+moneyText(original) : ""),
        stock:Number(stockInfo && stockInfo.total_available_stock || 0), views:0, likes:0, carts:0,
        status:productStatus(item), categoria:"Catálogo Shopee", itemId:item.item_id
      };
    });
  }
  function mapShopeeOrderStatus(status){
    return {UNPAID:"nao_pago",READY_TO_SHIP:"a_enviar",PROCESSED:"a_enviar",SHIPPED:"enviado",COMPLETED:"concluido",IN_CANCEL:"cancelado",CANCELLED:"cancelado",INVOICE_PENDING:"a_enviar"}[status] || "a_enviar";
  }
  function mapShopeeOrders(orders){
    return orders.map(function(order){
      var line = order.item_list && order.item_list[0] || {};
      return {
        id:String(order.order_sn || "—"), buyer:safeText(order.buyer_username || "Comprador Shopee"),
        status:mapShopeeOrderStatus(order.order_status), produto:safeText(line.item_name || "Itens do pedido"),
        qtd:Number(line.model_quantity_purchased || 1), precoUnit:Number(order.total_amount || line.model_discounted_price || 0),

    return Promise.all([
      fetch("/api/shopee/connection", {cache:"no-store"}).then(function(res){return res.ok ? res.json() : null;}).catch(function(){return null;}),
      fetch("/api/shopee/products", {cache:"no-store"}).then(function(res){return res.ok ? res.json() : null;}).catch(function(){return null;}),
      fetch("/api/shopee/orders", {cache:"no-store"}).then(function(res){return res.ok ? res.json() : null;}).catch(function(){return null;})

      var connection = results[0], products = results[1], orders = results[2];
      if(products && Array.isArray(products.items)){

  function pedidoStatusInfo(order){
    if(order.status==="nao_pago") return {label:"Não pago", tone:"warn"};
    if(order.status==="a_enviar") return {label:"A Enviar", tone:"warn"};
    if(order.status==="enviado") return {label:"Enviado", tone:"ok"};
    if(order.status==="concluido") return {label:"Concluído", tone:"ok"};
    return {label:"Cancelado", tone:"bad"};
  }

  /* A Shopee só mostra a renda estimada (preço − taxas). O ShopeeOS já desconta o custo real do produto por cima disso. */
  function computePedidoFinanceiro(order){
    var subtotal = order.precoUnit * order.qtd;
    if(order.status === "cancelado" || order.status === "nao_pago"){
      return {subtotal:subtotal, taxas:null, rendaEstimada:null, custoTotal:null, lucroReal:null};
    }
    var taxas = subtotal*CUSTO_CONFIG.taxaPerc + CUSTO_CONFIG.frete;
    var rendaEstimada = subtotal - taxas;
    var margem = findByName(PRODUTOS_MARGEM, order.produto);
    var custoTotal = (margem && margem.custo && margem.custo>0) ? margem.custo*order.qtd : null;
    var lucroReal = custoTotal!=null ? rendaEstimada - custoTotal : null;
    return {subtotal:subtotal, taxas:taxas, rendaEstimada:rendaEstimada, custoTotal:custoTotal, lucroReal:lucroReal};
  }

      var view = {
        current:"grid", produto:null, tab:0,
        statusTab:0, pillFiltro:"todos", flags:{}, busca:"", categoria:"todas", programa:"todos",
        sort:{key:null, dir:1}, selecionados:{}, expandido:false, layout:"grid"
      };
      var STATUS_TABS = [
        {key:"todos", label:"Todos"}, {key:"ativo", label:"Ativo (88)"}, {key:"violacao", label:"Violação (3)"},
        {key:"analise", label:"Sob Análise da Shopee (0)"}, {key:"naopublicado", label:"Não publicado (9)"},
      ];

      function backToGrid(){ view.current = "grid"; view.produto = null; render(); }

      function parsePriceMin(str){ var m = /R\$\s*([\d.,]+)/.exec(str||""); if(!m) return 0; return parseFloat(m[1].replace(/\./g,"").replace(",",".")); }
      function jaTemAds(name){ return ADS_PRODUTOS.some(function(a){ return a.name===name; }); }
      function isAdsPotential(p){ return !jaTemAds(p.name) && p.views>0; }
      function auditorNota(p){ var a = findByName(MELHORIA_ANUNCIOS, p.name); return a ? a.nota : null; }

      function filteredProducts(){
        return PRODUTOS_GRID.filter(function(p){
          if(view.statusTab>0 && p.status!==STATUS_TABS[view.statusTab].key) return false;
          if(view.pillFiltro==="repor" && p.stock!==0) return false;
          if(view.pillFiltro==="revisar"){ var nota = auditorNota(p); if(nota===null || nota>=7) return false; }
          var activeFlags = Object.keys(view.flags).filter(function(k){ return view.flags[k]; });
          if(activeFlags.length){
            var matches = activeFlags.some(function(f){
              if(f==="adsPotential") return isAdsPotential(p);
              return !!p[f];
            });
            if(!matches) return false;
          }
          if(view.categoria!=="todas" && p.categoria!==view.categoria) return false;
          if(view.programa==="desconto" && !p.off) return false;
          if(view.programa==="semdesconto" && p.off) return false;
          if(view.busca && p.name.toLowerCase().indexOf(view.busca.toLowerCase())===-1) return false;
          return true;
        });
      }

      function sortedProducts(list){
        if(!view.sort.key) return list;
        var key = view.sort.key, dir = view.sort.dir;
        return list.slice().sort(function(a,b){
          var va, vb;
          if(key==="preco"){ va = parsePriceMin(a.price); vb = parsePriceMin(b.price); }
          else if(key==="estoque"){ va = a.stock; vb = b.stock; }
          else { va = a.likes+a.carts; vb = b.likes+b.carts; }
          return (va-vb)*dir;
        });
      }

          });
        });
        p.push(sortLine);

        var sorted = sortedProducts(filtered);
        var gridEl = productGrid(sorted, function(prodItem){
          view.current = "editar"; view.produto = prodItem; view.tab = 0; render();
        }, openProductMenu);
        if(view.layout==="list") gridEl.classList.add("list-mode");
        Array.prototype.forEach.call(gridEl.querySelectorAll(".prodcard"), function(card, i){
          var pr = sorted[i];
          var cb = card.querySelector('input[type=checkbox]');
          cb.checked = !!view.selecionados[pr.name];
          cb.addEventListener("click", function(e){ e.stopPropagation(); });
          cb.addEventListener("change", function(){
            if(cb.checked) view.selecionados[pr.name] = true; else delete view.selecionados[pr.name];
            updateMassaLabel();
          });
        });
        if(!sorted.length){
          p.push(el("div","note","Nenhum produto encontrado com os filtros atuais."));
        } else {
          p.push(gridEl);
        }

        var totalPaginas = 1;
        var pager = el("div","pager");
        pager.innerHTML = '<span class="pg-prev" style="opacity:.4;cursor:default;">‹</span> Página <b>1</b> / '+totalPaginas+' <span class="pg-next" style="opacity:.4;cursor:default;">›</span><select><option>12 / página</option><option>24 / página</option><option>48 / página</option></select>';
        p.push(pager);

        updateMassaLabel();
        return p;
      }

      function buildEditor(){
        var prod = view.produto;
        var margem = findByName(PRODUTOS_MARGEM, prod.name);
        var auditor = findByName(MELHORIA_ANUNCIOS, prod.name);
        var nodes = [];

        var back = el("button","back-link","‹ Produtos");
        back.addEventListener("click", backToGrid);
        nodes.push(back);

        nodes.push(pageHead("Editar: "+prod.name, "Edição de anúncio — espelha as abas reais do Seller Center, com custo e margem já integrados ao resto do ShopeeOS."));

        var tabs = tabsRow(EDIT_TABS, view.tab);
        Array.prototype.forEach.call(tabs.querySelectorAll(".tab"), function(btn, idx){
          btn.addEventListener("click", function(){ view.tab = idx; render(); });
        });
        nodes.push(tabs);

        var content;
        if(view.tab===0) content = tabInfoBasica(prod, auditor);
        else if(view.tab===1) content = tabEspecificacao();
        else if(view.tab===2) content = tabDescricao(prod);
        else if(view.tab===3) content = tabInfoVenda(prod, margem);
        else if(view.tab===4) content = tabFiscal(prod);
        else if(view.tab===5) content = tabEnvio();
        else content = tabOutros(prod, margem);
        nodes.push(content);

        var footer = editFooter();
        var btns = footer.querySelectorAll("button");
        btns[0].addEventListener("click", backToGrid);
        btns[2].addEventListener("click", backToGrid);
        nodes.push(footer);

        return nodes;
      }

      function render(){
        container.innerHTML = "";
        var nodes = view.current === "editar" ? buildEditor() : buildGrid();
        nodes.forEach(function(n){ container.appendChild(n); });
      }

      render();
      return [container];
    }},

    {id:"ads", icon:"📢", label:"Shopee Ads", build:function(){

      function itemStatus(it){ return it.roas>0 ? "andamento" : "pausado"; }

        return ADS_PRODUTOS.filter(function(it){
          if(view.group===1 && it.tipo!=="GMV Max") return false;
          var st = itemStatus(it);
          if(view.status===1 || view.status===4 || view.status===5) return false;
          if(view.status===2 && st!=="andamento") return false;
          if(view.status===3 && st!=="pausado") return false;
          if(view.tipo!=="todos" && it.tipo!==view.tipo) return false;
          var diag = itemDiag(it);
          if(view.diag==="atencao" && diag.tone!=="bad") return false;
          if(view.diag==="bom" && diag.tone!=="good") return false;
          if(view.diag==="semdados" && diag.tone!=="neutral") return false;
          if(view.proteRoas && itemTags(it).indexOf("Proteção ROAS")===-1) return false;
          if(view.roasMin>0 && !(it.roas>=view.roasMin)) return false;
          if(view.busca && it.name.toLowerCase().indexOf(view.busca.toLowerCase())===-1) return false;
          return true;
        });
      }

      var p = [pageHead("Shopee Ads","Espelha o Desempenho de Anúncios de Produtos do Ads Center, com diagnóstico e sugestão prontos por anúncio.","ads")];
      p.push(container);

      function render(){

        });

        ctrls.appendChild(selPeriodo);

        btnExport.addEventListener("click", function(){

            })));

          {label:"Cliques",value:fmtK(BASE_ADS_KPI.cliques*fator),tip:"Cliques no anúncio"},
          {label:"CTR",value:BASE_ADS_KPI.ctr.toFixed(2).replace(".",",")+"%",tip:"Cliques ÷ impressões"},
          {label:"Pedidos",value:String(Math.round(BASE_ADS_KPI.pedidos*fator))},
          {label:"Itens vendidos",value:String(Math.round(BASE_ADS_KPI.itens*fator))},
          {label:"Vendas",value:fmtMoney(BASE_ADS_KPI.vendas*fator)},

          {label:"ROAS",value:(BASE_ADS_KPI.vendas/BASE_ADS_KPI.investimento).toFixed(2).replace(".",","),hl:"orange",tip:"Retorno sobre o investimento em Ads"},

        kpiList.push({label:"Taxa de adições ao carrinho",value:BASE_ADS_KPI.taxaCarrinho.toFixed(2).replace(".",",")+"%"});
        container.appendChild(kpis(kpiList));

        container.appendChild(adsPerfChart([
          {label:"02/09",a:14,b:6},{label:"03/09",a:22,b:24},{label:"04/09",a:12,b:5},{label:"05/09",a:19,b:9},
          {label:"06/09",a:24,b:8},{label:"07/09",a:15,b:6},{label:"08/09",a:29,b:10},
        ]));

        var itemsAtencao = ADS_PRODUTOS.filter(function(it){ return itemDiag(it).tone==="bad"; }).length;
        var lh = el("div","list-headrow");

          var tbody = el("tbody");
          items.forEach(function(it){
            var tr = el("tr");
            var diag = itemDiag(it);
            var tags = itemTags(it);
            function deltaCell(v){ return '<div class="deltacell"><span class="v">'+v+'</span></div>'; }
            var impressoesIt = it.ctr>0 ? Math.round(it.cliques / (it.ctr/100)) : 0;
            tr.innerHTML =
              '<td><div class="prodcell"><div class="thumb">📦</div><div>'+
                '<b>'+it.name+'</b><span class="sub">Anúncio de Produto'+(it.tipo==="GMV Max"?" · GMV Max":"")+' · Meta de ROAS</span>'+
                '<span class="statusdot"><i></i>'+(itemStatus(it)==="andamento"?"Em andamento":"Pausado")+'</span><br>'+
                tags.map(function(tg){return '<span class="tag">'+tg+'</span>';}).join("")+
              '</div></div></td>'+
              '<td>'+it.budget+'</td><td>'+it.metaRoas.toFixed(1).replace(".",",")+'</td>'+
              '<td class="diagcell"><span class="'+(diag.tone==="bad"?"bad":diag.tone==="good"?"good":"")+'">'+diag.msg+'</span></td>'+
              '<td>'+deltaCell(fmtMoney(it.investimento))+'</td><td>'+deltaCell(fmtMoney(it.receita))+'</td>'+
              '<td>'+deltaCell(it.roas>0?it.roas.toFixed(2).replace(".",",")+"x":"—")+'</td>'+
              '<td>'+deltaCell(fmtK(impressoesIt))+'</td><td>'+deltaCell(it.ctr.toFixed(2).replace(".",",")+"%")+'</td>';
            var diagTd = tr.querySelector(".diagcell");
            var actBtn = el("button","btn sm primary", diag.tone==="bad" ? "Otimizar" : diag.tone==="good" ? "Ver detalhes" : "Ver diagnóstico");
            actBtn.addEventListener("click", function(){
              var body = el("div");
              body.appendChild(el("div","note", diag.msg));
              if(diag.tone==="bad"){
                var b1 = el("button","btn sm","Reduzir ROAS alvo em 10%");
                b1.style.marginRight = "8px";
                b1.addEventListener("click", function(){ it.metaRoas = Math.round(it.metaRoas*0.9*10)/10; closeModal(); render(); });
                body.appendChild(b1);
                var m = findMelhoria(it.name);
                if(m){
                  var b2 = el("button","btn sm primary","Ver checklist de melhoria ›");
                  b2.addEventListener("click", function(){ closeModal(); go("melhoria"); });
                  body.appendChild(b2);
                }
              } else if(diag.tone==="good"){
                var b3 = el("button","btn sm primary","Aumentar meta de ROAS em 10%");
                b3.addEventListener("click", function(){ it.metaRoas = Math.round(it.metaRoas*1.1*10)/10; closeModal(); render(); });
                body.appendChild(b3);
              } else {
                body.appendChild(el("div","note","Verifique se o orçamento diário não está zerado ou se o anúncio foi pausado manualmente no Ads Center."));
              }
              openModal(it.name, "Ações de otimização", body);
            });
            diagTd.appendChild(actBtn);
            tbody.appendChild(tr);
          });
          t.appendChild(tbody);
          wrap.appendChild(t);
          tableSlot.appendChild(wrap);
        }
        renderTableOnly();
      }

      render();
      return p;
    }},

    {id:"seo", icon:"🔎", label:"SEO / Busca", build:function(){
      var container = el("div");
      container.style.display = "contents";
      var active = 0;
      var selecionadas = {}; /* termos marcados pra entrar no título sugerido, por produto */

      function termoNoTitulo(termo, titulo){
        var palavrasTermo = termo.toLowerCase().split(" ").filter(function(w){ return w.length>2; });
        var tituloLower = titulo.toLowerCase();
        var achadas = palavrasTermo.filter(function(w){ return tituloLower.indexOf(w) !== -1; });
        return achadas.length / palavrasTermo.length >= 0.6;
      }

      var p = [pageHead("SEO / Busca dentro da Shopee","Palavras-chave e categoria certa aumentam o alcance orgânico.","seo")];
      var pills = pillRow(SEO_PRODUTOS.map(function(s){return s.name;}), 0);
      p.push(pills);
      p.push(container);

      function render(){
        container.innerHTML = "";
        var prod = SEO_PRODUTOS[active];
        var sel = selecionadas[prod.name] || (selecionadas[prod.name] = {});

        var jaNoTitulo = prod.keywords.filter(function(k){ return termoNoTitulo(k.termo, prod.tituloAtual); });
        var scoreLabel = jaNoTitulo.length+"/"+prod.keywords.length;

        container.appendChild(kpis([
          {label:"Palavras-chave no título", value:scoreLabel, tone: jaNoTitulo.length===prod.keywords.length ? "up" : "down"},
          {label:"Categoria", value: prod.categoriaOk ? "Correta" : "Revisar", tone: prod.categoriaOk ? "up" : "down"},
          {label:"Produtos com título 100% otimizado", value: SEO_PRODUTOS.filter(function(s){ return s.keywords.every(function(k){ return termoNoTitulo(k.termo, s.tituloAtual); }); }).length+"/"+SEO_PRODUTOS.length},
        ], "cols-3"));

        var kwRows = rowList(prod.keywords.map(function(k){
          var noTitulo = termoNoTitulo(k.termo, prod.tituloAtual);
          var marcada = !!sel[k.termo];
          return {
            icon: noTitulo ? "✅" : (marcada ? "🟢" : "🔑"),
            title: "\""+k.termo+"\"",
            sub: (noTitulo ? "já está no título atual" : (marcada ? "marcada — clique pra remover do título sugerido" : "clique pra adicionar ao título sugerido"))+" · aparece em "+k.concorrentes+" dos top 10 concorrentes",
            meta: k.cobertura,
            onClick: noTitulo ? null : function(){ sel[k.termo] = !sel[k.termo]; render(); }
          };
        }));
        container.appendChild(section("Palavras-chave sugeridas para o título","🏷️",[kwRows]));

        var extras = Object.keys(sel).filter(function(t){ return sel[t]; });
        var tituloSugerido = prod.tituloAtual;
        extras.forEach(function(termo){
          var palavras = termo.split(" ").filter(function(w){
            return tituloSugerido.toLowerCase().indexOf(w.toLowerCase()) === -1;
          });
          if(palavras.length) tituloSugerido += " " + palavras.join(" ");
        });

        var previewBox = el("div","card");
        var copyBtn = el("button","btn sm "+(extras.length?"primary":"ghost"), "📋 Copiar título sugerido");
        copyBtn.disabled = extras.length===0;
        previewBox.innerHTML = '<div style="font-size:11.5px;color:var(--text-muted);margin-bottom:6px;">Título atual: <span style="opacity:.8;">'+prod.tituloAtual+'</span></div>'+
          '<div style="font-size:13px;font-weight:600;margin-bottom:10px;">Sugerido: '+tituloSugerido+' <span style="font-weight:400;color:var(--text-muted);">('+tituloSugerido.length+"/60)"+'</span></div>';
        previewBox.appendChild(copyBtn);
        copyBtn.addEventListener("click", function(){
          function feedback(ok){
            copyBtn.textContent = ok ? "✓ Copiado — cole no título do anúncio no Seller Center" : "Não foi possível copiar";
            setTimeout(function(){ copyBtn.textContent = "📋 Copiar título sugerido"; }, 2200);
          }
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(tituloSugerido).then(function(){ feedback(true); }, function(){ feedback(false); });
          } else {
            try{
              var ta = document.createElement("textarea");
              ta.value = tituloSugerido; ta.style.position="fixed"; ta.style.opacity="0";
              document.body.appendChild(ta); ta.select();
              var ok = document.execCommand("copy");
              document.body.removeChild(ta);
              feedback(ok);
            }catch(e){ feedback(false); }
          }
        });
        container.appendChild(section("Título sugerido","✍️",[previewBox]));

        var catSection;
        if(prod.categoriaOk){
          catSection = section("Categoria","📂",[alertBar("ok","✅","Categoria correta","\""+prod.name+"\" está em \""+prod.categoria+"\", igual a maioria dos concorrentes diretos.")]);
        } else {
          var fixBar = alertBar("warn","⚠️","Categoria pode estar prejudicando o alcance",
            "\""+prod.name+"\" está em \""+prod.categoria+"\" — a maioria dos concorrentes usa uma categoria mais específica de eletrônicos. Categorias erradas reduzem o alcance na busca por filtro.",
            [{label:"Marcar como corrigida", primary:true, onClick:function(){ prod.categoriaOk = true; render(); }}]);
          catSection = section("Categoria","📂",[fixBar,
            el("div",null,'<span style="font-size:11px;color:var(--text-muted);">A correção definitiva é feita na edição do anúncio, no Seller Center — aqui você só acompanha o diagnóstico.</span>')]);
        }
        container.appendChild(catSection);
      }

      var pillBtns = pills.querySelectorAll(".pill-btn");
      Array.prototype.forEach.call(pillBtns, function(btn, idx){
        btn.addEventListener("click", function(){
          Array.prototype.forEach.call(pillBtns, function(b){ b.classList.remove("active"); });
          btn.classList.add("active");
          active = idx;
          render();
        });
      });

      render();
      return p;
    }},

    {id:"preco", icon:"💰", label:"Precificação e Lucro", build:function(){
      var p = [pageHead("Precificação e Lucro","Reprecificação automática, calculadoras e diagnóstico de queda de venda.","preco")];

        if(hasVar){

            varRows.push(vtr);
            allMarginRefs.push({price:v.price, custo0:v.custo, input:vInput.querySelector("input"), margemTd:vMargemTd});
          });

          var state = {expanded:false};
          function updateExpand(){

          }

          expanders.push({state:state, update:updateExpand});

          }

        {label:"Modo automático",sub:"decide e aplica o novo preço sozinho, avisa por e-mail depois",on:true},
        {label:"Modo manual assistido",sub:"gera a análise e espera você clicar Aplicar / Não aplicar",on:false},

    {id:"concorrencia", icon:"🕵️", label:"Análise de Concorrência", build:function(){

      container.style.display = "contents"; /* "invisível" no layout — deixa o ritmo vertical (.page > * + *) enxergar os blocos de dentro como se fossem direto da página */
      var active = 0;

      var p = [pageHead("Análise de Concorrência","Concorrentes confirmados por anúncio, histórico de preço e monitoramento contínuo.","concorrencia")];
      var pills = pillRow(CONCORRENCIA_PRODUTOS.map(function(e){return e.name;}), 0);
      p.push(pills);
      p.push(container);

      function render(){
        container.innerHTML = "";
        var entry = CONCORRENCIA_PRODUTOS[active];
        var ameaca = entry.concorrentes.some(function(c){ return c.dataMudanca && (c.preco - c.precoAnterior) < 0; });

        container.appendChild(section("Concorrentes de: "+entry.name,"🎯",[concorrenciaTable(entry)]));
        container.appendChild(section("Histórico de mudanças de preço","📉",[concorrenciaTimeline(entry)]));
        if(ameaca){
          var diag = section("Diagnóstico","🧠",[
            alertBar("warn","📩", entry.name+" — concorrente baixou o preço", "Isso pode justificar uma reprecificação. Veja o diagnóstico completo e o preço sugerido na Precificação e Lucro.",
              [{label:"Ver diagnóstico ›",primary:true,onClick:function(){ go("preco"); }}])
          ]);
          container.appendChild(diag);
        }

        var addRow = fieldRow([{label:"Link do anúncio concorrente",value:""}]);
        var addInput = addRow.querySelector("input");
        var addBtn = el("button","btn sm primary","➕ Adicionar concorrente");
        addBtn.style.marginTop = "10px";
        addBtn.addEventListener("click", function(){
          var link = addInput.value.trim();
          if(!link){ addInput.focus(); return; }
          var apelido = "Concorrente "+String.fromCharCode(65 + entry.concorrentes.length%26);
          entry.concorrentes.push({name:apelido, preco:entry.meuPreco, precoAnterior:entry.meuPreco, dataMudanca:null, posicao:entry.concorrentes.length+3, vendas30d:0, ads:false, link:link});
          render();
        });
        addRow.appendChild(addBtn);
        container.appendChild(section("Adicionar concorrente manualmente","➕",[
          el("div",null,'<span style="font-size:11px;color:var(--text-muted);">Cole o link do anúncio — o preço e histórico começam zerados até o próximo monitoramento.</span>'),
          addRow
        ]));
      }

      var pillBtns = pills.querySelectorAll(".pill-btn");
      Array.prototype.forEach.call(pillBtns, function(btn, idx){
        btn.addEventListener("click", function(){
          Array.prototype.forEach.call(pillBtns, function(b){ b.classList.remove("active"); });
          btn.classList.add("active");
          active = idx;
          render();
        });
      });

      render();
      return p;
    }},

    {id:"impostos", icon:"🧾", label:"Impostos", build:function(){
      var container = el("div");
      container.style.display = "contents"; /* "invisível" no layout — deixa o ritmo vertical (.page > * + *) enxergar os blocos de dentro como se fossem direto da página */

      /* Dias até o vencimento, contados a partir da mesma data de "hoje" (09/09/2026) usada no resto do protótipo. */
      function diasAte(dataStr){
        var pt = dataStr.split("/");
        var due = new Date(parseInt(pt[2],10), parseInt(pt[1],10)-1, parseInt(pt[0],10));
        var hoje = new Date(2026,8,9);
        return Math.round((due-hoje)/86400000);
      }

      function render(){
        container.innerHTML = "";
        var p = [];
        p.push(pageHead("Impostos","Comprovantes e prazos organizados num só lugar.", "impostos"));

        p.push(el("div","tip-box","💡 O ShopeeOS não emite nota fiscal nem calcula guia de imposto — esse painel só organiza os comprovantes que você já recebe e os prazos de pagamento, pra você não perder a data. Pra fechamento oficial, confirme sempre com seu contador."));

        var pendentes = OBRIGACOES_FISCAIS.filter(function(o){ return !o.pago; });
        var proxima = pendentes[0];
        var dias = proxima ? diasAte(proxima.vencimento) : null;

        p.push(kpis([
          {label:"Faturamento bruto (mês)", value:"R$ 2.016,42", delta:"mesmo valor usado no Financeiro", tone:"neutral"},
          {label:"Regime tributário", value:"Simples Nacional", delta:"cadastrado nas Configurações da Loja", tone:"neutral"},
          {label:"Recibos emitidos (2026)", value:String(RECIBOS_FISCAIS.length)},
          {label:"Próxima guia (DAS)", value: proxima ? proxima.valor : "Tudo em dia",
            delta: proxima ? ("vence em "+dias+" dia(s) · "+proxima.vencimento) : "nenhuma pendência",
            tone: proxima ? (dias<=5 ? "down" : "neutral") : "up"},
        ]));

        var obrigCard = el("div","card togglepanel");
        OBRIGACOES_FISCAIS.forEach(function(o, idx){
          var row = el("div","row");
          row.innerHTML = '<div class="txt"><b>'+o.label+' — '+o.competencia+'</b><span>Vence em '+o.vencimento+' · '+o.valor+'</span></div>'+
            '<label class="switch"><input type="checkbox" '+(o.pago?"checked":"")+'><span class="track"><span class="thumb"></span></span></label>';
          row.querySelector("input").addEventListener("change", function(){ o.pago = this.checked; render(); });
          obrigCard.appendChild(row);
        });
        p.push(section("Calendário de obrigações","📅",[
          el("div","field-note","Marque como pago assim que quitar a guia — é só um controle seu, não muda nada na Shopee nem na Receita."),
          obrigCard
        ]));

        p.push(section("Recibos e comprovantes","📄",[rowList(RECIBOS_FISCAIS.map(function(r){
          return {
            icon:"📄", title:"Recibo — "+r.competencia,
            sub:"emitido em "+r.emitidoEm+" · enviado por "+r.enviadoPara,
            meta: chip("neutral","PDF"),
            onClick:function(){
              var body = el("div");
              body.innerHTML =
                '<div class="fieldrow">'+
                  '<div class="field"><label>Competência</label><div>'+r.competencia+'</div></div>'+
                  '<div class="field"><label>Emitido em</label><div>'+r.emitidoEm+'</div></div>'+
                  '<div class="field"><label>Faturamento do período</label><div>'+r.faturamento+'</div></div>'+
                  '<div class="field"><label>Tipo</label><div>'+r.tipo+'</div></div>'+
                '</div>'+
                '<div class="field-note">Comprovante ilustrativo do protótipo — no sistema real, seria o mesmo recibo que a Shopee (ou seu contador) já te envia por e-mail.</div>';
              openModal("Recibo — "+r.competencia, r.tipo, body);
            }
          };
        }))], true));

        p.forEach(function(n){ container.appendChild(n); });
      }

      render();
      return [container];
    }},

    {id:"atendimento", icon:"💬", label:"Atendimento / Chat", build:function(){
      var container = el("div");
      container.style.display = "contents"; /* "invisível" no layout — deixa o ritmo vertical (.page > * + *) enxergar os blocos de dentro como se fossem direto da página */
      var view = {active:0};

      var naoLidas = CONVERSAS.filter(function(c){return c.unread;}).length;
      var precisamVoce = CONVERSAS.filter(function(c){return c.precisaVoce;}).length;

      var p = [pageHead("Atendimento ao Cliente","Central de mensagens com rascunhos de resposta prontos pela IA.","atendimento")];
      p.push(kpis([
        {label:"Tempo médio de resposta",value:"8 min"},
        {label:"Taxa de resposta",value:"98%"},
        {label:"Conversas não lidas",value:String(naoLidas),tone:naoLidas>0?"down":"up"},
        {label:"Precisam de você",value:String(precisamVoce),tone:precisamVoce>0?"down":"up"},
      ]));
      p.push(section("Central de Mensagens","💬",[container]));

      function render(){
        container.innerHTML = "";
        var wrap = el("div","chat-wrap");

        var list = el("div","chat-list");
        CONVERSAS.forEach(function(c, idx){
          var item = el("div","chat-item"+(idx===view.active?" active":""));
          var lastMsg = c.messages[c.messages.length-1];
          item.innerHTML = '<div class="avatar">'+chatBuyerInitials(c.buyer)+'</div>'+
            '<div class="cinfo"><div class="ctop"><b>'+c.buyer+'</b><span class="ctime">'+lastMsg.time+'</span></div>'+
            '<span class="clast">'+(lastMsg.from==="loja"?"Você: ":"")+lastMsg.text+'</span></div>'+
            (c.unread ? '<span class="unread-dot"></span>' : '');
          item.addEventListener("click", function(){ view.active = idx; c.unread = false; render(); });
          list.appendChild(item);
        });
        wrap.appendChild(list);

        var thread = el("div","chat-thread");
        var active = CONVERSAS[view.active];
        var head = el("div","chat-thread-head");
        head.innerHTML = '<div><b>'+active.buyer+'</b><br><span>'+active.produto+'</span></div>'+
          (active.status==="resolvida" ? chip("ok","resolvida") : chip("warn","aberta"));
        thread.appendChild(head);

        var msgsWrap = el("div","chat-messages");
        active.messages.forEach(function(m){
          var bubble = el("div","msg "+m.from);
          bubble.innerHTML = m.text+'<span class="mtime">'+m.time+'</span>';
          msgsWrap.appendChild(bubble);
        });
        thread.appendChild(msgsWrap);

        var input;
        if(active.sugestao || active.precisaVoce){
          var sug = el("div","chat-suggest"+(active.precisaVoce?" needsyou":""));
          if(active.precisaVoce){
            sug.innerHTML = '<div><b>Precisa de você</b>Pergunta fora do padrão — a IA não tem confiança suficiente pra responder sozinha.</div>';
          } else {
            sug.innerHTML = '<div><b>Rascunho sugerido pela IA</b>'+active.sugestao+'</div><button class="btn sm primary">Usar</button>';
          }
          thread.appendChild(sug);
          if(!active.precisaVoce){
            sug.querySelector("button").addEventListener("click", function(){ input.value = active.sugestao; input.focus(); });
          }
        }

        var inputRow = el("div","chat-input-row");
        inputRow.innerHTML = '<input type="text" placeholder="Escreva uma mensagem...">';
        input = inputRow.querySelector("input");
        var sendBtn = el("button","btn sm primary","Enviar");
        sendBtn.addEventListener("click", function(){
          var text = input.value.trim();
          if(!text) return;
          active.messages.push({from:"loja", text:text, time:"agora"});
          active.unread = false;
          render();
        });
        input.addEventListener("keydown", function(e){ if(e.key==="Enter") sendBtn.click(); });
        inputRow.appendChild(sendBtn);
        thread.appendChild(inputRow);

        wrap.appendChild(thread);
        container.appendChild(wrap);
        msgsWrap.scrollTop = msgsWrap.scrollHeight;
      }

      render();
      return p;
    }},

              var sub = body.querySelector("#bf_sub").value.trim() || "sem data de término";
              BANNERS.push({icon:"🖼️", title:titulo, sub:sub});
              closeModal();
              render();
            });
            body.appendChild(addBtn);
            openModal("Adicionar banner", "Aparece no topo da sua página de loja", body);
          });
          row.appendChild(addCard);
        }
        bannerCard.appendChild(row);
        return [
          section("Banners da loja","🖼️",[
            el("div","tip-box","💡 Banners aparecem no topo da sua página de loja — bom lugar pra destacar promoções e datas fortes."),
            bannerCard
          ]),
          section("Coleções em destaque","⭐",[rowList([
            {icon:"📺",title:"Acessórios de TV",sub:"12 produtos na vitrine",meta:chip("ok","em destaque")},
            {icon:"🔌",title:"Carregadores e Cabos",sub:"8 produtos na vitrine",meta:chip("ok","em destaque")},
          ])]),
        ];
      }

      function buildConfiguracoes(){
        return [
          section("Frete e Devolução","🚚",[togglePanel([
            {label:"Frete grátis da loja", sub:"cobre o frete acima de R$ 79 em todo o catálogo", on:true},
            {label:"Devolução facilitada", sub:"comprador pode devolver em até 7 dias sem justificativa", on:true},
          ])]),
          section("Atendimento e Retirada","💬",[
            togglePanel([{label:"Resposta automática fora do horário", sub:"envia mensagem padrão quando ninguém está online", on:true}]),
            fieldRow([{label:"Horário de atendimento",value:"09:00 – 18:00"},{label:"Endereço de retirada",value:"Guarujá, SP"}])
          ]),
        ];
      }

      function render(){
        container.innerHTML = "";
        var nodes = view.tab===0 ? buildPerfil() : view.tab===1 ? buildDecoracao() : buildConfiguracoes();
        nodes.forEach(function(n){ container.appendChild(n); });
      }

      render();
      return p;
    }},

    {id:"dashboard-geral", icon:"📊", label:"Dashboard Geral", build:function(){
      var container = el("div");
      container.style.display = "contents";
      var periodos = ["Hoje","Ontem","7 dias","30 dias","Mês Atual","Personalizado"];
      var fatores = [0.045, 0.040, 0.22, 0.92, 1, 1];
      var view = {active:4};

      /* baseline = dados de "Mês Atual" (mesmo faturamento cross-referenciado em Impostos/Financeiro);
         os outros períodos são derivados por escala proporcional, com leve variação por KPI pra parecer real. */
      var BASE = {
        faturamento:2016.42, margem:928.00, pedidos:76, ticket:27.25,
        adsInvest:231.39, adsVendas:72, adsConv:2.42, adsReceita:1965.02, adsCusto:3.21, adsCliques:2973, adsCtr:3.43, adsRoas:8.49,
      };
      function esc(v, f, jitter){ return v * f * (1 + (jitter||0)); }

      var p = [pageHead("Dashboard Geral","Análise financeira e operacional da loja — panorama único juntando vendas, Ads e margem.","dashboard-geral")];

      var tabs = tabsRow(periodos, view.active);
      p.push(tabs);
      p.push(container);

      function render(){
        container.innerHTML = "";
        var f = fatores[view.active];
        var label = periodos[view.active];

        if(view.active===5){
          var custom = el("div","card");
          custom.innerHTML = '<div style="font-size:12.5px;margin-bottom:10px;">Escolha um intervalo personalizado — os números são recalculados proporcionalmente ao período do Mês Atual.</div>';
          var fr = fieldRow([{label:"De",type:"date",value:"2026-09-01"},{label:"Até",type:"date",value:"2026-09-09"}]);
          var applyBtn = el("button","btn sm primary","Aplicar período");
          applyBtn.style.marginTop = "10px";
          applyBtn.addEventListener("click", function(){
            var inputs = fr.querySelectorAll("input");
            var d1 = new Date(inputs[0].value), d2 = new Date(inputs[1].value);
            var dias = Math.max(1, Math.round((d2-d1)/86400000)+1);
            fatores[5] = Math.min(1.3, dias/30);
            render();
          });
          fr.appendChild(applyBtn);
          container.appendChild(section("Período personalizado","📅",[custom, fr]));
        }

        container.appendChild(kpis([
          {label:"Faturamento",value:fmtMoney(esc(BASE.faturamento,f)),delta:"não inclui frete · vs. período anterior",tone: f<1?"down":"up"},
          {label:"Margem de Contribuição",value:fmtMoney(esc(BASE.margem,f)),hl:"blue",delta:"46% do faturamento",tone: f<1?"down":"up"},
          {label:"Pedidos",value:String(Math.max(0,Math.round(esc(BASE.pedidos,f)))),delta:"período: "+label,tone: f<1?"down":"up"},
          {label:"Ticket Médio",value:fmtMoney(BASE.ticket*(0.9+f*0.1)),delta:"média por pedido",tone:"neutral"},
        ]));

        container.appendChild(kpis([
          {label:"Investimento em ADS",value:fmtMoney(esc(BASE.adsInvest,f)),tone: f<1?"down":"up"},
          {label:"Vendas",value:String(Math.max(0,Math.round(esc(BASE.adsVendas,f)))),tone: f<1?"down":"up"},
          {label:"Conversão",value:BASE.adsConv.toFixed(2).replace(".",",")+"%",tone:"up"},
          {label:"Receita",value:fmtMoney(esc(BASE.adsReceita,f)),tone: f<1?"down":"up"},
          {label:"Custo/Venda",value:fmtMoney(BASE.adsCusto),tone:"down"},
          {label:"Cliques",value:String(Math.max(0,Math.round(esc(BASE.adsCliques,f)))),tone: f<1?"down":"up"},
          {label:"CTR",value:BASE.adsCtr.toFixed(2).replace(".",",")+"%",tone:"down"},
          {label:"ROAS",value:BASE.adsRoas.toFixed(2).replace(".",",")+"x",hl:"orange",tone:"up"},
        ]));

        container.appendChild(section("Evolução no Período","📈",[
          chartCard("Faturamento vs. Margem de Contribuição","período: "+label+", valores diários",[
            {label:"10/08",vendas:80,ads:35},{label:"13/08",vendas:105,ads:48},{label:"16/08",vendas:60,ads:28},
            {label:"19/08",vendas:15,ads:8},{label:"22/08",vendas:20,ads:10},{label:"25/08",vendas:18,ads:9},
            {label:"28/08",vendas:22,ads:11},{label:"31/08",vendas:112,ads:52},{label:"03/09",vendas:75,ads:38},
            {label:"06/09",vendas:98,ads:45},{label:"08/09",vendas:40,ads:18},
          ], "faturamento", "margem")
        ]));

        container.appendChild(section("Top Produtos · "+label,"🏅",[rankedProductList([
          {name:"Kit Festa Homem-Aranha Personalizado", sub:"festa.H.Aranha · "+Math.max(1,Math.round(24*f))+" un · 32,1% das vendas", valor:esc(647.76,f), margem:esc(422.21,f)},
          {name:"Kit para Colorir Infantil 100 Desenhos Animes A4", sub:"sem SKU · "+Math.max(1,Math.round(19*f))+" un · 23,8% das vendas", valor:esc(480.66,f), margem:null},
          {name:"Livro de Colorir Infantil Animes 200 Desenhos A4", sub:"200anime · "+Math.max(1,Math.round(12*f))+" un · 17,4% das vendas", valor:esc(350.88,f), margem:esc(245.10,f)},
          {name:"Carregador Turbo USB-C 33W", sub:"turbo.33w · "+Math.max(1,Math.round(6*f))+" un · 5,0% das vendas", valor:esc(101.75,f), margem:esc(64.65,f)},
        ])]));

        container.appendChild(section("Produtos com ADS ativo","📣",[adsProdutosTable(ADS_PRODUTOS)]));
      }

      var tabBtns = tabs.querySelectorAll(".tab");
      Array.prototype.forEach.call(tabBtns, function(btn, idx){
        btn.addEventListener("click", function(){
          Array.prototype.forEach.call(tabBtns, function(b){ b.classList.remove("active"); });
          btn.classList.add("active");
          view.active = idx;
          render();
        });
      });

      render();
      return p;
    }},
  ];

  var SETTINGS = {id:"config", icon:"⚙️", label:"Configurações"};

  /* Modo Simples: só as abas do dia a dia de quem está começando.
     Modo Avançado (padrão): todas as abas, incluindo análises mais profundas. */
  var SIMPLE_MODE_IDS = ["dashboard","pedidos","produtos","loja","atendimento","preco","financeiro","promocoes","estoque","ads"];

  /* ---------------- Chrome / nav ---------------- */
  var sidebar = document.getElementById("sidebar");
  var page = document.getElementById("page");
  var app = document.getElementById("app");
  var displayMode = "avancado";
  try{ displayMode = localStorage.getItem("shopeeos_mode") || displayMode; }catch(e){}

  function buildModeSwitcher(){
    var sw = el("div","mode-switcher");
    var simplesBtn = el("button","mode-btn"+(displayMode==="simples"?" active":""),"Simples");
    var avancadoBtn = el("button","mode-btn"+(displayMode==="avancado"?" active":""),"Avançado");
    simplesBtn.addEventListener("click", function(){ setMode("simples"); });
    avancadoBtn.addEventListener("click", function(){ setMode("avancado"); });
    sw.appendChild(simplesBtn);
    sw.appendChild(avancadoBtn);
    return sw;
  }

  function setMode(mode){
    if(mode === displayMode) return;
    displayMode = mode;
    try{ localStorage.setItem("shopeeos_mode", mode); }catch(e){}
    var activeBtn = sidebar.querySelector(".navbtn.active");
    var currentId = activeBtn ? activeBtn.dataset.id : "dashboard";
    buildSidebar();
    if(currentId === SETTINGS.id){
      go(SETTINGS.id);
    } else if(mode === "simples" && SIMPLE_MODE_IDS.indexOf(currentId) === -1){
      go("dashboard");
    } else {
      markActive(currentId);
    }
  }

  function buildSidebar(){
    sidebar.innerHTML = "";
    sidebar.appendChild(buildModeSwitcher());
    sidebar.appendChild(el("div","group-label","Central de Gestão"));
    var visibleCats = displayMode === "simples"
      ? CATEGORIES.filter(function(c){ return SIMPLE_MODE_IDS.indexOf(c.id) !== -1; })
      : CATEGORIES;
    visibleCats.forEach(function(c){
      var pendingTag = PAGE_REVISADA[c.id] ? "" : '<span class="pending-tag" title="Ainda não passou pela revisão funcional completa">🔧</span>';
      var b = el("button","navbtn","<span class=\"ic\">"+c.icon+"</span><span>"+c.label+"</span>"+pendingTag);
      b.dataset.id = c.id;
      b.addEventListener("click", function(){ go(c.id); });
      sidebar.appendChild(b);
    });
    sidebar.appendChild(el("div","group-label","Sistema"));
    var sb = el("button","navbtn","<span class=\"ic\">"+SETTINGS.icon+"</span><span>"+SETTINGS.label+"</span>");
    sb.dataset.id = SETTINGS.id;
    sb.addEventListener("click", function(){ go(SETTINGS.id); });
    sidebar.appendChild(sb);
  }

  function markActive(id){
    Array.prototype.forEach.call(sidebar.querySelectorAll(".navbtn"), function(b){
      b.classList.toggle("active", b.dataset.id === id);
    });
  }

  function buildSettingsPage(){
    var wrap = [];
    wrap.push(pageHead("Configurações","Tema visual, notificações e integrações do ShopeeOS.","config"));

    var themeSec = section("Tema visual","🎨",[]);
    var grid = el("div","grid cols-3");
    THEMES.forEach(function(t){
      var card = el("button","themecard");
      card.dataset.os = t.id;
      card.innerHTML = '<div class="swatch"><i style="background:'+t.c1+'"></i><b style="background:'+t.c2+'"></b></div>'+
        '<h4>'+t.name+'</h4><p>'+t.era+'</p>';
      if(t.id === app.getAttribute("data-os")) card.classList.add("active");
      card.addEventListener("click", function(){ setTheme(t.id); });
      grid.appendChild(card);
    });
    themeSec.appendChild(grid);
    wrap.push(themeSec);

    var modeCard = el("div","card");
    modeCard.appendChild(buildModeSwitcher());
    wrap.push(section("Modo de Exibição","🧭",[
      el("div","tip-box","💡 <b>Simples</b> mostra só as abas essenciais do dia a dia. <b>Avançado</b> mostra tudo, incluindo análises mais profundas. Dá pra trocar aqui ou pelo topo do menu, a qualquer momento."),
      modeCard
    ]));

    wrap.push(section("Alertas de expiração de promoções","⏳",[fieldRow([
      {label:"1º aviso (dias de antecedência)",value:"3",type:"number"},
      {label:"2º aviso (dias de antecedência)",value:"1",type:"number"},
      {label:"Horário do Cron Job",value:"08:00",type:"time"},
    ])]));

    wrap.push(section("Reprecificação automática","💰",[togglePanel([
      {label:"Ativar fase de teste",sub:"registra diagnósticos sem aplicar preço",on:false},
      {label:"Modo automático (após fase de teste)",sub:"aplica o novo preço sozinho e notifica por e-mail",on:true},
      {label:"Piso mínimo de margem",sub:"nunca sugerir preço abaixo de 15% de margem",on:true},
    ])]));

    wrap.push(section("Notificações","🔔",[fieldRow([
      {label:"E-mail para avisos",value:"otacilio@msatacado.com.br",type:"email"},
      {label:"Idioma",value:"Português (Brasil)",type:"select",options:["Português (Brasil)","English","Español"]},
    ])]));

    var resetBtn = el("button","btn sm ghost","🔄 Reiniciar tutoriais de todas as páginas");
    var resetMsg = el("span","note");
    resetMsg.style.marginLeft = "10px";
    resetBtn.addEventListener("click", function(){
      Tour.resetAllSeen();
      resetMsg.textContent = "Pronto! O tour guiado vai aparecer de novo na próxima vez que você visitar cada página.";
    });
    var tutWrap = el("div");
    tutWrap.appendChild(resetBtn);
    tutWrap.appendChild(resetMsg);
    wrap.push(section("Tutoriais","❓",[
      el("div","tip-box","💡 Cada página tem um botão \"❓ Como usar essa página\" que reabre o tour guiado dela (com destaque nos elementos principais) a qualquer momento. Na primeira visita, ele aparece sozinho."),
      tutWrap
    ]));

    wrap.push(section("Integrações","🔌",[rowList([
      {icon:"🛒",title:"Shopee Open API",sub:"Partner ID conectado",meta:chip("ok","conectado")},
      {icon:"🗄️",title:"Supabase",sub:"banco de dados do projeto",meta:chip("ok","conectado")},
      {icon:"✨",title:"Gemini AI",sub:"gera diagnósticos e sugestões",meta:chip("ok","conectado")},
      {icon:"▲",title:"Vercel Cron Job",sub:"executa a análise automática diária",meta:chip("ok","ativo")},
      {icon:"✉️",title:"E-mail transacional",sub:"envio dos alertas e relatórios",meta:chip("warn","pendente")},
    ])]));

    return wrap;
  }

  var pendingAutoTourTimer = null;
  function go(id){
    if(displayMode === "simples" && id !== SETTINGS.id && SIMPLE_MODE_IDS.indexOf(id) === -1){ id = "dashboard"; }
    /* cancela qualquer auto-tour ainda pendente da página anterior — sem isso, uma navegação
       rápida (trocar de página antes dos 150ms) podia deixar um tour "atrasado" abrir
       apontando pra elementos da página errada. Também fecha um tour que porventura já
       esteja aberto, já que a página que ele descrevia acabou de ser substituída. */
    if(pendingAutoTourTimer){ clearTimeout(pendingAutoTourTimer); pendingAutoTourTimer = null; }
    Tour.dismiss();
    page.innerHTML = "";
    markActive(id);
    var nodes;
    if(id === SETTINGS.id){ nodes = buildSettingsPage(); }
    else {
      var cat = CATEGORIES.filter(function(c){return c.id===id;})[0];
      nodes = cat ? cat.build() : [el("div","empty-note","Categoria não encontrada.")];
    }
    nodes.forEach(function(n){ page.appendChild(n); });
    page.scrollTop = 0;
    try{ localStorage.setItem("shopeeos_page", id); }catch(e){}
    if(typeof refreshNotifBadge === "function") refreshNotifBadge();
    pendingAutoTourTimer = setTimeout(function(){ pendingAutoTourTimer = null; Tour.autoStartIfNeeded(id); }, 150);
  }

  function setTheme(id){
    app.setAttribute("data-os", id);
    try{ localStorage.setItem("shopeeos_theme", id); }catch(e){}
    if(document.getElementById("page").firstElementChild && sidebar.querySelector(".navbtn.active")){
      var activeId = sidebar.querySelector(".navbtn.active").dataset.id;
      go(activeId);
    }
    Array.prototype.forEach.call(document.querySelectorAll(".themecard"), function(c){
      c.classList.toggle("active", c.dataset.os === id);
    });
  }

  /* ---------------- Sino de notificações ---------------- */
  var notifWrap = document.getElementById("notifWrap");
  var notifBtn = document.getElementById("notifBtn");
  var notifPanel = el("div","notif-panel");
  notifPanel.hidden = true;
  notifWrap.appendChild(notifPanel);

  function refreshNotifBadge(){
    var old = notifWrap.querySelector(".notif-badge");
    if(old) old.remove();
    var notifs = getNotificacoes();
    if(notifs.length){
      notifWrap.appendChild(el("span","notif-badge", String(notifs.length)));
    }
  }

  function renderNotifPanel(){
    var notifs = getNotificacoes();
    notifPanel.innerHTML = "";
    notifPanel.appendChild(el("div","nphead","Notificações"));
    if(!notifs.length){
      notifPanel.appendChild(el("div","notif-empty","Nenhuma notificação nova."));
    } else {
      NOTIF_CATS.forEach(function(cat){
        var doCategoria = notifs.filter(function(n){ return n.cat === cat.id; });
        if(!doCategoria.length) return;
        notifPanel.appendChild(el("div","notif-catlabel", cat.icon+" "+cat.label));
        doCategoria.forEach(function(n){
          var item = el("div","notif-item");
          item.innerHTML = '<div class="nic">'+n.icon+'</div><div class="ntxt"><b>'+n.text+'</b><span>'+n.sub+'</span></div>';
          item.addEventListener("click", function(){ notifPanel.hidden = true; go(n.goTo); });
          notifPanel.appendChild(item);
        });
      });
    }
  }

  notifBtn.addEventListener("click", function(e){
    e.stopPropagation();
    if(notifPanel.hidden){ renderNotifPanel(); notifPanel.hidden = false; }
    else { notifPanel.hidden = true; }
  });
  notifPanel.addEventListener("click", function(e){ e.stopPropagation(); });
  document.addEventListener("click", function(){ notifPanel.hidden = true; });

  /* ---------------- Sair (logoff) ---------------- */
  var logoutBtn = document.getElementById("logoutBtn");
  if(logoutBtn){
    logoutBtn.addEventListener("click", function(){
      var body = el("div");
      body.appendChild(el("div","note","Isso encerra a sessão aqui no protótipo e volta pro estado inicial (tema, modo e última página visitada salvos neste navegador serão limpos)."));
      var btnRow = el("div");
      btnRow.style.marginTop = "12px";
      var confirmBtn = el("button","btn sm primary","Sair da loja");
      confirmBtn.addEventListener("click", function(){
        try{
          localStorage.removeItem("shopeeos_theme");
          localStorage.removeItem("shopeeos_mode");
          localStorage.removeItem("shopeeos_page");
        }catch(e){}
        closeModal();
        location.reload();
      });
      var cancelBtn = el("button","btn sm ghost","Cancelar");
      cancelBtn.style.marginLeft = "8px";
      cancelBtn.addEventListener("click", closeModal);
      btnRow.appendChild(confirmBtn);
      btnRow.appendChild(cancelBtn);
      body.appendChild(btnRow);
      openModal("Sair da loja", "MS Atacado · Otacilio", body);
    });
  }

  buildSidebar();
  var savedTheme = "gestor", savedPage = "dashboard";
  try{ savedTheme = localStorage.getItem("shopeeos_theme") || savedTheme; }catch(e){}
  try{ savedPage = localStorage.getItem("shopeeos_page") || savedPage; }catch(e){}
  app.setAttribute("data-os", savedTheme);
  go(savedPage);
  refreshNotifBadge();
  loadRealShopeeData();
})();
</script>

</body></html>
