name: Dev validation

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

concurrency:
  group: dev-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
