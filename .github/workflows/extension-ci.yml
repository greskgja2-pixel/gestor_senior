name: Gestor Senior Extension CI

on:
  push:
    branches:
      - feature/gestor-senior-extension-v1
    paths:
      - 'extension/**'
      - 'app/api/shopee/ads-analytics/route.js'
      - 'app/api/extension-intelligence/**'
      - 'app/extensao-shopee-intelligence/**'
      - '.github/workflows/extension-ci.yml'
  pull_request:
    paths:
      - 'extension/**'
      - 'app/api/shopee/ads-analytics/route.js'
      - 'app/api/extension-intelligence/**'
      - 'app/extensao-shopee-intelligence/**'
      - '.github/workflows/extension-ci.yml'

jobs:
  extension-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate manifest JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('manifest OK')"
      - name: Syntax check extension scripts
        working-directory: extension
        run: npm run check
      - name: Syntax check Gestor APIs
        run: |
          node --check app/api/shopee/ads-analytics/route.js
          node --check app/api/extension-intelligence/reports/route.js
          node --check app/api/extension-intelligence/schedules/route.js
      - name: Run Super Anuncio regression
        working-directory: extension
        run: npm test
      - name: Validate referenced extension files
        run: |
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('extension/manifest.json','utf8'));
          const refs=[m.background?.service_worker,m.side_panel?.default_path,...(m.content_scripts||[]).flatMap(x=>x.js||[])].filter(Boolean);
          for(const f of refs){if(!fs.existsSync('extension/'+f))throw new Error('Missing '+f)}
          for(const f of ['sidepanel-v3.css','sidepanel-v3.js','guided-audit.css','guided-audit.js','pending-audit-bridge.js','competitor-picker-panel.js','analytics.html','analytics.css','analytics-landscape.css','analytics.js','tutorials.css','tutorials.js','src/competitor-picker-content.js','src/lib/xlsx-export.js','src/gestor-bridge.js']){if(!fs.existsSync('extension/'+f))throw new Error('Missing '+f)}
          console.log('manifest/dashboard/guided/tutorial/bridge/picker refs OK');
          NODE
      - name: Build installable extension ZIP
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')).version")
          PANEL=$(node -p "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')).side_panel.default_path")
          mkdir -p dist
          cd extension
          zip -r "../dist/Gestor-Senior-Shopee-Intelligence-v${VERSION}.zip" \
            manifest.json icons icon.svg \
            sidepanel-v3.css sidepanel-v3.js "$PANEL" guided-audit.css guided-audit.js pending-audit-bridge.js competitor-picker-panel.js \
            analytics.html analytics.css analytics-landscape.css analytics.js \
            tutorials.css tutorials.js \
            src INSTALL.md VERSION_SOURCES.md \
            -x 'src/**/*.map'
          cd ..
          ZIP="dist/Gestor-Senior-Shopee-Intelligence-v${VERSION}.zip"
          node - <<'NODE' > /tmp/manifest-refs.txt
          const m=require('./extension/manifest.json');
          const refs=['manifest.json',m.background?.service_worker,m.side_panel?.default_path,...(m.content_scripts||[]).flatMap(x=>x.js||[])].filter(Boolean);
          console.log([...new Set(refs)].join('\n'));
          NODE
          while IFS= read -r f; do
            zipinfo -1 "$ZIP" | grep -Fx "$f" >/dev/null || { echo "ZIP missing $f"; exit 1; }
          done < /tmp/manifest-refs.txt
          echo "ZIP manifest refs OK"
      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: Gestor-Senior-Shopee-Intelligence
          path: dist/Gestor-Senior-Shopee-Intelligence-v*.zip
          if-no-files-found: error
          retention-days: 30
