name: Gestor Pro Monitor Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-monitor/**'
      - '.github/workflows/gestor-pro-monitor-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gestor-Pro-Monitor-debug-apk
          path: android-monitor/app/build/outputs/apk/debug/*.apk
          retention-days: 30