name: Gestor Pro Monitor Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-monitor/**'
      - '.github/workflows/gestor-pro-monitor-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "SDK root: $ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager unavailable; checking preinstalled components"
          else
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" --sdk_root="$ANDROID_SDK_ROOT"
          fi
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gestor-Pro-Monitor-debug-apk
          path: android-monitor/app/build/outputs/apk/debug/*.apk
          retention-days: 30